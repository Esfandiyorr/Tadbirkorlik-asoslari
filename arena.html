    KVS.rows=[{q:"",a:""},{q:"",a:""},{q:"",a:""}]; KVS.seed=1; kvRowsDraw(); kvUpdate();
  };
  document.getElementById("kvPasteB").onclick=function(){ var p=document.getElementById("kvPaste"); p.hidden=!p.hidden; if(!p.hidden) document.getElementById("kvPT").focus(); };
  document.getElementById("kvPOk").onclick=function(){
    var add=KV.parseLines(document.getElementById("kvPT").value); if(!add.length){ toast(L("Matn bo'sh","The text is empty")); return; }
    var cur=KVS.rows.filter(function(r){ return r.q||r.a; });
    KVS.rows=cur.concat(add).slice(0,KV.max.words); document.getElementById("kvPT").value=""; document.getElementById("kvPaste").hidden=true;
    kvRowsDraw(); kvUpdate(); toast("✅ "+add.length+" "+L("qator qo'shildi","rows added"));
  };
  var pv=document.getElementById("kvPrev");
  pv.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.id==="kvShuf"){ KVS.seed++; kvUpdate(); }
    else if(b.id==="kvPdf") kvPdf(b);
  });
  pv.addEventListener("change",function(e){ if(e.target.id==="kvShow"){ KVS.show=e.target.checked; kvPreview(); } });
  pv.addEventListener("mouseover",function(e){ kvHl(e.target.closest("[data-w]")); });
  pv.addEventListener("mouseout",function(){ kvHl(null); });
  pv.addEventListener("focusin",function(e){ kvHl(e.target.closest("[data-w]")); });
  pv.addEventListener("focusout",function(){ kvHl(null); });
  kvUpdate(); kvFitAll(); window.addEventListener("resize",kvFitAll);
}
function kvFit(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight+2,130)+"px"; }
function kvFitAll(){ [].forEach.call(document.querySelectorAll("#kvRows .kv-q"),kvFit); }
function kvRowsDraw(){ document.getElementById("kvRows").innerHTML=KVS.rows.map(kvRowHtml).join(""); kvFitAll(); }
function kvAddRow(){
  if(KVS.rows.length>=KV.max.words){ toast(L("Eng ko'pi bilan "+KV.max.words+" ta so'z","At most "+KV.max.words+" words")); return; }
  KVS.rows.push({q:"",a:""}); kvRowsDraw(); kvUpdate();
  var last=document.getElementById("kvRows").lastChild; if(last) last.querySelector(".kv-q").focus();
}
function kvSoon(){ clearTimeout(KVT); KVT=setTimeout(kvUpdate,220); }
function kvHl(el){
  [].forEach.call(document.querySelectorAll("#kvPrev .kv-c.hl"),function(c){ c.classList.remove("hl"); });
  var w=el&&el.getAttribute("data-w"); if(!w) return;
  w.split(" ").forEach(function(k){ [].forEach.call(document.querySelectorAll('#kvPrev .kv-g[data-w~="'+k+'"] .kv-c'),function(c){ c.classList.add("hl"); }); });
}
function kvUpdate(){
  if(!document.getElementById("kvRows")) return;
  KVP=KV.build(KVS.rows,{seed:KVS.seed}); kvPersist();
  var st={}; KVP.words.forEach(function(w){ st[w.i]={ok:w}; }); KVP.unplaced.forEach(function(u){ st[u.i]={why:u.why}; }); KVP.skipped.forEach(function(u){ st[u.i]={why:u.why}; });
  var WHY={nofit:["⚠️",L("sig'madi","no fit"),L("Bu so'z boshqalar bilan umumiy harf topa olmadi. Javobni o'zgartiring yoki «Boshqa variant» ni bosing.","This word shares no letters with the rest. Change it or press Another layout.")],
           alone:["⏳",L("yana so'z","add more"),L("Krossvord uchun kamida 2 ta so'z kerak","At least 2 words are needed")],
           short:["✂️",L("2+ harf","2+ letters"),L("Javob kamida 2 harfdan iborat bo'lsin","The answer needs 2+ letters")],
           long:["✂️",L("uzun","too long"),L("Javob "+KV.max.len+" harfdan oshmasin","At most "+KV.max.len+" letters")],
           dup:["⧉",L("takror","duplicate"),L("Bu javob allaqachon bor","This answer already exists")],
           many:["✂️",L("ko'p","too many"),L("Eng ko'pi bilan "+KV.max.words+" ta so'z","At most "+KV.max.words+" words")]};
  var rows=document.getElementById("kvRows").children;
  KVS.rows.forEach(function(r,i){
    var el=rows[i]&&rows[i].querySelector(".kv-st"); if(!el) return;
    var s=st[i], cls="kv-st", txt="", ttl="";
    if(s&&s.ok){ txt="✅ "+s.ok.n+(s.ok.dir==="A"?"→":"↓"); cls+=" ok"; if(!s.ok.clue){ txt="✏️ "+L("savol","clue"); cls="kv-st warn"; ttl=L("Savol yozilmagan","The clue is empty"); } else ttl=L("Joylashdi","Placed"); }
    else if(s&&s.why){ var w=WHY[s.why]; txt=w[0]+" "+w[1]; ttl=w[2]; cls+=" warn"; }
    el.className=cls; el.textContent=txt; el.title=ttl;
  });
  var filled=KVS.rows.filter(function(r){ return r.a.trim(); }).length;
  document.getElementById("kvCnt").textContent=filled+" / "+KV.max.words;
  kvPreview();
}
function kvPreview(){
  var pv=document.getElementById("kvPrev"), p=KVP; if(!pv||!p) return;
  if(!p.words.length){
    var msg=p.unplaced.some(function(u){ return u.why==="nofit"; })
      ?L("Bu so'zlar umumiy harfga ega emas — kesishadigan javoblar yozing.","These words share no letters — write answers that can cross.")
      :L("Kamida 2 ta savol-javob yozing — krossvord shu yerda paydo bo'ladi.","Write at least 2 clues and answers — the crossword will appear here.");
    pv.innerHTML='<div class="kv-empty"><div style="font-size:54px">🧩</div><b>'+L("Krossvord hali tuzilmadi","No crossword yet")+'</b><p class="note">'+msg+'</p></div>';
    return;
  }
  var C=34, w=p.cols*C+4, h=p.rows*C+4, own={};
  p.words.forEach(function(wd){ for(var k=0;k<wd.len;k++){ var key=(wd.r+(wd.dir==="D"?k:0))+","+(wd.c+(wd.dir==="A"?k:0)); (own[key]=own[key]||[]).push(wd.n+wd.dir); } });
  var g="";
  for(var r=0;r<p.rows;r++) for(var c=0;c<p.cols;c++){
    var t=p.cells[r][c]; if(!t) continue;
    var x=2+c*C, y=2+r*C, n=p.num[r][c];
    g+='<g class="kv-g" data-w="'+own[r+","+c].join(" ")+'"><rect class="kv-c" x="'+x+'" y="'+y+'" width="'+C+'" height="'+C+'" rx="3"/>'+
      (n?'<text class="kv-cn" x="'+(x+3)+'" y="'+(y+10)+'">'+n+'</text>':'')+
      (KVS.show?'<text class="kv-cl'+(t.length>1?" sm":"")+'" x="'+(x+C/2)+'" y="'+(y+C*.68)+'" text-anchor="middle">'+esc(t)+'</text>':'')+'</g>';
  }
  function list(dir,head){
    var ws=p.words.filter(function(wd){ return wd.dir===dir; });
    return '<div class="kv-cl-h">'+head+'</div><ul class="kv-cl">'+ws.map(function(wd){
      return '<li tabindex="0" data-w="'+wd.n+wd.dir+'"><b>'+wd.n+'.</b> '+(wd.clue?esc(wd.clue):'<i class="kv-miss">'+L("savol yozilmagan","no clue")+'</i>')+' <small>'+esc(wd.lens)+'</small>'+(KVS.show?' <span class="kv-ans">'+esc(wd.cells.join(""))+'</span>':'')+'</li>'; }).join("")+'</ul>';
  }
  var un=p.unplaced.filter(function(u){ return u.why==="nofit"; }).map(function(u){ return esc(KVS.rows[u.i].a); });
  pv.innerHTML=
    '<div class="kv-bar"><span class="kv-chip">✅ '+p.stats.placed+' / '+p.stats.words+' '+L("so'z","words")+'</span><span class="kv-chip">✚ '+p.stats.cross+' '+L("kesishma","crossings")+'</span><span class="kv-chip">▦ '+p.cols+'×'+p.rows+'</span></div>'+
    '<div class="kv-act"><button type="button" class="btn sm ghost" id="kvShuf">🔀 '+L("Boshqa variant","Another layout")+'</button>'+
      '<label class="kv-sw"><input type="checkbox" id="kvShow"'+(KVS.show?" checked":"")+'> '+L("Javoblarni ko'rsatish","Show answers")+'</label>'+
      '<button type="button" class="btn accent" id="kvPdf" style="margin-left:auto">📄 '+L("PDF yuklab olish","Download PDF")+'</button></div>'+
    (un.length?'<p class="kv-warn">⚠️ '+L("Krossvordga sig'madi (PDF ga kirmaydi): ","Did not fit (not in the PDF): ")+'<b>'+un.join(", ")+'</b></p>':'')+
    '<div class="kv-svgw"><svg class="kv-svg" viewBox="0 0 '+w+' '+h+'" style="max-width:'+Math.min(p.cols*40,680)+'px" role="img" aria-label="'+esc(L("Krossvord setkasi","Crossword grid"))+'">'+g+'</svg></div>'+
    '<div class="kv-lists"><div>'+list("A","GORIZONTAL →")+'</div><div>'+list("D","VERTIKAL ↓")+'</div></div>';
}
function kvPdf(btn){
  var p=KVP; if(!p||p.words.length<2){ toast(L("Avval kamida 2 ta so'z kiriting","Enter at least 2 words first")); return; }
  var miss=p.words.filter(function(w){ return !w.clue; }).length;
  if(miss){ toast("✏️ "+miss+" "+L("ta so'zga savol yozilmagan","words have no clue")); return; }
  var title=(KVS.title||"").trim()||L("Krossvord","Crossword"), old=btn.innerHTML; btn.disabled=true; btn.innerHTML="⏳ "+L("Tayyorlanmoqda…","Preparing…");
  setTimeout(function(){
    KV.pdf(p,{title:title,author:((ME.name||"")+" "+(ME.surname||"")).trim(),group:ME.group||""}).then(function(blob){
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="krossvord-"+(title.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g,"-").replace(/^-+|-+$/g,"")||"yangi")+".pdf";
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
      toast("✅ "+L("PDF yuklab olindi","PDF downloaded"));
    }).catch(function(){ toast(L("PDF yaratib bo'lmadi","Could not create the PDF")); })
      .then(function(){ btn.disabled=false; btn.innerHTML=old; });
  },30);
}

/* ---------- ⌨️ YOZUV MARAFONI (YZ moduli: _reyting-manba/yozuv.js) ---------- */
function vYozuv(){
  if(!window.YZ){ APP.innerHTML=card('<p class="note">⚠️ '+L("Yozuv Marafoni yuklanmadi — sahifani yangilang.","The typing game did not load — reload the page.")+'</p>'); return; }
  YZ.mount(APP,{L:L,toast:toast,FX:FX,DB:DB,nav:nav,tmo:tmo,kget:kget,kput:kput,claimMe:claimMe,clockSync:clockSync,saToken:saToken,
    snow:snow,kday:kday,kHM:kHM,kLeft:kLeft,me:function(){ return ME; },online:function(){ return online; },base:function(){ return BASE; }});
}
/* bosh sahifadagi kartada keyingi jonli poyga holati */
var YZHT=null;
function homeYz(){
  clearInterval(YZHT);
  if(!BASE) return;
  var q='?orderBy='+encodeURIComponent('"$key"')+'&startAt='+encodeURIComponent('"'+kday(Date.now()-86400000)+'"')+'&limitToFirst=20';
  tmo(fetch(BASE+"/kahoot/idx.json"+q),9000).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(idx){
    var list=Object.keys(idx||{}).map(function(k){ var e=idx[k]; if(e) e.d=k; return e; })
      .filter(function(e){ return e&&e.type==="yz"&&+e.end>Date.now(); }).sort(function(a,b){ return a.start-b.start; }), g=list[0];
    if(!g) return;
    function draw(){
      var c=document.getElementById("yzcard"), s=document.getElementById("yzcS"); if(!c||!s){ clearInterval(YZHT); return; }
      var t=Date.now(), txt;
      if(t<g.open) txt="🔴 "+L("Jonli poyga","Live race")+": "+kWhen(g.d,g.start)+" · "+L("boshlanishiga ","starts in ")+kLeft(g.start-t);
      else if(t<g.start) txt="🔴 "+L("Jonli poyga lobbisi ochiq — qo'shiling! ","Live race lobby is open — join! ")+kLeft(g.start-t);
      else if(t<g.end) txt="🏃 "+L("Jonli poyga hozir ketmoqda!","A live race is on now!");
      else { clearInterval(YZHT); txt="🏁 "+L("Jonli poyga tugadi — natijalarni ko'ring","The live race is over — see the results"); }
      c.classList.toggle("hot",t>=g.open&&t<g.end);
      if(s.textContent!==txt) s.textContent=txt;
    }
    draw(); YZHT=setInterval(draw,1000);
  });
}

/* ---------- router ---------- */
function route(){
  if(window.YZ) YZ.unmount();
  unwatchAll(); clearInterval(TICK); clearInterval(HB); clearInterval(HOMET); clearInterval(YZHT); lvStop();
  if(RUN&&RUN.off){ try{RUN.off()}catch(e){} RUN=null; }
  var cd=document.querySelector(".cd"); if(cd) cd.remove();
  var h=location.hash||"#/";
  if(!ME) return need();
  if(ME.status&&ME.status!=="ok") return pending();
  if(h==="#/kross") return vKross();            /* krossvord yasash — server va arena holatiga bog'liq emas */
  if(h==="#/yozuv") return vYozuv();            /* Yozuv Marafoni: mashq internetsiz ham ishlaydi, jonli poyga — arena yopiq bo'lsa ham */
  if(!online) return offline();
  if(h==="#/live") return vLive();              /* jonli test arena yopiq bo'lsa ham ishlaydi */
  if(!ARENA_OPEN) return closed();
  if(h.indexOf("#/room/")===0) return vRoom(h.slice(7).toUpperCase().slice(0,4));
  if(h==="#/create") return vCreate();
  if(h==="#/join") return vJoin();
  return vHome();
}
window.addEventListener("hashchange",route);
chrome();
document.getElementById("btnSnd").textContent=FX.isMuted()?"🔇":"🔊";
loadMe();
APP.innerHTML=card('<p class="note center">'+L("Serverga ulanmoqda…","Connecting…")+'</p>');
connect(function(ok,why){ online=ok; route(); if(!ok&&why==="rules") offline(); });
})();
