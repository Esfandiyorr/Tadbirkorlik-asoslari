<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O'yin Arenasi — TerDU</title>
<meta name="description" content="Tadbirkorlik asoslari · talabalar o'rtasidagi kichik musobaqalar: 10 ta mini-o'yin, xona kodi, jonli reyting.">
<link rel="icon" href="logo_tersu.png">
<style>
:root{
  --bg:#eef3fb; --bg2:#e6ecf9;
  --panel:#ffffff; --panel2:#f7f9fe;
  --ink:#0d1b2a; --ink2:#1f2d3d; --muted:#5b6b82;
  --line:#e1e8f4; --shadow:0 18px 40px -18px rgba(13,27,42,.35);
  --green:#12a150; --green2:#0b7a3c;
  --orange:#f97316; --amber:#f59e0b;
  --violet:#7c3aed; --pink:#ec4899;
  --blue:#2563eb; --cyan:#0891b2;
  --red:#e11d48; --teal:#0d9488;
  --chip:#f1f5fd; --ok:#12a150; --err:#e11d48;
}
:root[data-theme="dark"]{
  --bg:#080f1d; --bg2:#0d1728;
  --panel:#111b2e; --panel2:#0e1726;
  --ink:#eaf1ff; --ink2:#dbe6fb; --muted:#9db0cd;
  --line:#22304c; --shadow:0 18px 44px -18px rgba(0,0,0,.75);
  --green:#2ee07f; --green2:#12a150; --chip:#16223a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
a{color:var(--blue)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:contain;background:#fff}
.brand b{display:block;font-size:13.5px;letter-spacing:.3px}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.topbar .spacer{flex:1}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:.16s;text-decoration:none}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.accent{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border-color:transparent}
.btn.vio{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;border-color:transparent}
.btn.warn{background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;border-color:transparent}
.btn.ghost{background:var(--panel2)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kicker{display:inline-block;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;
  border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.grad{background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:clamp(24px,4vw,38px)}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.gcard:hover{transform:translateY(-3px);border-color:var(--violet);box-shadow:var(--shadow)}
.gcard.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--panel))}
.gcard .ic{font-size:26px;display:block;margin-bottom:6px}
.gcard b{display:block;font-size:14.5px;margin-bottom:3px}
.gcard span{display:block;font-size:11.8px;color:var(--muted);line-height:1.45}
.gcard .tick{position:absolute;top:8px;right:9px;font-size:15px;opacity:0}
.gcard.on .tick{opacity:1}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--panel2);color:var(--ink);font-size:15px;font-weight:600;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:800;letter-spacing:7px;
  background:var(--chip);border-radius:14px;padding:10px 16px;display:inline-block}
.plist{display:grid;gap:10px}
.pl{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px}
.pl.empty{opacity:.5;border-style:dashed}
.pl .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:none}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:14.5px}
.pl .nm span{display:block;font-size:11.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--muted)}
.tag.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tag.host{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--orange)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;padding:10px 12px;text-align:left}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:10px 12px;border-bottom:1px solid var(--line)}
tr.me td{background:color-mix(in srgb,var(--green) 12%,transparent);font-weight:700}
.tw{overflow-x:auto}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}
.cd{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,10,20,.86);color:#fff}
.cd b{font-size:clamp(70px,22vw,180px);font-weight:900;animation:pop .8s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:22px;z-index:95;
  background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;font-weight:800;padding:11px 20px;
  border-radius:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:11px 15px;margin-bottom:14px;position:sticky;top:62px;z-index:30}
.hud .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;font-weight:800;min-width:52px;text-align:center}
.hud .t.low{color:var(--red)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.center{text-align:center}
.big{font-size:clamp(30px,7vw,56px);font-weight:900;line-height:1.1}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:13px;padding:13px 15px;margin-bottom:9px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s}
.opt:hover{border-color:var(--blue)}
.opt.pick{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.wr{display:grid;gap:6px;justify-content:center;margin:12px 0}
.wrow{display:flex;gap:6px}
.wc{width:clamp(38px,11vw,54px);height:clamp(38px,11vw,54px);border:2px solid var(--line);border-radius:10px;
  display:grid;place-items:center;font-size:clamp(18px,5vw,26px);font-weight:800;text-transform:uppercase;background:var(--panel2)}
.wc.g{background:var(--green);border-color:var(--green);color:#fff}
.wc.y{background:var(--amber);border-color:var(--amber);color:#fff}
.wc.b{background:var(--muted);border-color:var(--muted);color:#fff;opacity:.65}
.kb{display:grid;gap:5px;margin-top:10px}
.kbr{display:flex;gap:4px;justify-content:center}
.key{min-width:clamp(26px,7.4vw,38px);padding:10px 4px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.key.g{background:var(--green);color:#fff}.key.y{background:var(--amber);color:#fff}.key.b{opacity:.4}
.key.w{min-width:52px;font-size:11.5px}
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--chip);padding:8px;border-radius:14px;
  max-width:340px;margin:0 auto;touch-action:none;user-select:none}
.t2{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:clamp(16px,5vw,24px);
  background:var(--panel2);color:var(--ink);transition:.1s}
canvas{max-width:100%;border-radius:14px;background:var(--panel2);touch-action:none;display:block;margin:0 auto}
.wclue{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;border-radius:14px;
  padding:11px 14px;margin:0 auto 12px;max-width:440px;text-align:center;font-size:14.5px;font-weight:600;line-height:1.45}
.mem{display:grid;gap:12px;max-width:620px;margin:0 auto}
.mc{aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;font-family:inherit;
  perspective:800px;-webkit-tap-highlight-color:transparent}
.mc .f{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d}
.mc.up .f,.mc.done .f{transform:rotateY(180deg)}
.mc .a,.mc .b2{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;
  backface-visibility:hidden;box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.mc .a{background:linear-gradient(135deg,var(--violet),var(--blue));color:rgba(255,255,255,.85);font-size:clamp(22px,6vw,32px)}
.mc .b2{background:var(--panel);border:2px solid var(--line);transform:rotateY(180deg);
  font-size:clamp(40px,13vw,72px);line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.18)}
/* 3D ba'zi brauzerlarda ishlamasligi mumkin — ko'rinishni sinf bilan ham boshqaramiz */
.mc .b2{opacity:0;transition:opacity 0s linear .2s}
.mc.up .b2,.mc.done .b2{opacity:1}
.mc .a{opacity:1;transition:opacity 0s linear .2s}
.mc.up .a,.mc.done .a{opacity:0}
.mc.done .b2{background:color-mix(in srgb,var(--green) 18%,transparent);border-color:var(--green)}
.mc:not(.done):not(.up):hover .f{transform:scale(1.04)}
.mc.done{cursor:default}
@media(max-width:520px){ .mem{gap:9px;max-width:100%} }
.typ{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:17px;
  line-height:1.75;letter-spacing:.2px;min-height:90px}
.typ i{font-style:normal}
.typ i.ok{color:var(--green)}
.typ i.no{background:color-mix(in srgb,var(--red) 25%,transparent);border-radius:3px}
.typ i.cur{border-bottom:3px solid var(--blue)}
.rx{height:min(46vh,300px);border-radius:18px;display:grid;place-items:center;font-size:clamp(20px,5vw,30px);
  font-weight:800;color:#fff;cursor:pointer;user-select:none;text-align:center;padding:16px}
.rx.wait{background:linear-gradient(135deg,#334155,#1e293b)}
.rx.go{background:linear-gradient(135deg,var(--green),var(--teal))}
.rx.bad{background:linear-gradient(135deg,var(--red),var(--pink))}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.tc{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);
  font-size:clamp(30px,9vw,46px);font-weight:900;cursor:pointer;font-family:inherit;color:var(--ink)}
.tc:disabled{cursor:default}
.tc.x{color:var(--blue)}.tc.o{color:var(--pink)}
.dd{display:grid;gap:10px}
.ddtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
.chatbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;height:150px;
  overflow-y:auto;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.chatbox .g{color:var(--green);font-weight:700}
.rank{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:14px;background:var(--panel2);
  border:1px solid var(--line);margin-bottom:8px}
.rank .pos{font-size:19px;width:34px;text-align:center;font-weight:800}
.rank .pts{font-weight:800;color:var(--green);font-size:17px}
.win{background:linear-gradient(135deg,var(--amber),var(--orange));color:#fff;border-radius:20px;padding:22px;text-align:center}
.win .big{font-size:clamp(26px,6vw,44px)}
@media(max-width:700px){
  .wrap{padding:14px 12px 50px}
  .hud{top:56px;padding:9px 12px;gap:9px}
  .brand span{display:none}
}

/* ===== o'yin effektlari ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:88;display:none;background:transparent;border-radius:0;max-width:none;margin:0}
.stage{position:relative;overflow:hidden}
.stage.gb::before{content:"";position:absolute;inset:0;z-index:0;opacity:.5;
  background:radial-gradient(circle at 15% 20%,var(--c1),transparent 45%),radial-gradient(circle at 85% 75%,var(--c2),transparent 45%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.25) rotate(6deg)}}
.stage>*{position:relative;z-index:1}
.pop{position:fixed;z-index:92;font-weight:900;font-size:26px;color:var(--green);pointer-events:none;
  text-shadow:0 2px 10px rgba(0,0,0,.25);animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-64px) scale(1.25);opacity:0}}
.shake{animation:shk .36s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ring{width:52px;height:52px;flex:none}
.ring circle{fill:none;stroke-width:6;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .bgc{stroke:var(--chip)}
.ring .fgc{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.opps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opp{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px 3px 3px;font-size:12px;font-weight:700}
.opp .av{width:24px;height:24px;min-width:24px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:#fff}
.opp .pb{width:46px;height:5px;border-radius:9px;background:var(--chip);overflow:hidden}
.opp .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .4s}
.opp.done{border-color:var(--green)}
.streak{display:inline-block;background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;
  border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;animation:pop2 .3s}
@keyframes pop2{from{transform:scale(.5)}to{transform:scale(1)}}
.t2{animation:tin .18s}
@keyframes tin{from{transform:scale(.6);opacity:.4}to{transform:scale(1);opacity:1}}
.t2.mg{animation:tmg .22s}
@keyframes tmg{50%{transform:scale(1.18)}}
.wc.fl{animation:flip .45s}
@keyframes flip{50%{transform:rotateX(90deg)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:12px auto 0}
.pad button{padding:15px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  font-size:20px;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer}
.pad button:active{background:var(--chip)}
.pad .ok{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border-color:transparent}
.pad .del{background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;border-color:transparent}
.hint{display:inline-flex;gap:5px;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:5px}
.wline{position:absolute;height:6px;border-radius:6px;background:var(--green);transform-origin:0 50%;animation:grow .4s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.lvl{display:flex;gap:4px;align-items:center}
.lvl i{width:9px;height:9px;border-radius:50%;background:var(--chip);display:block}
.lvl i.on{background:var(--amber)}
.rt-diag{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}

/* ===== JOSUS ===== */
.sp-wrap{max-width:620px;margin:0 auto}
.sp-card{perspective:1200px;height:300px;margin:0 auto;max-width:380px;cursor:pointer}
.sp-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.sp-card.open .sp-inner{transform:rotateY(180deg)}
.sp-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;
  text-align:center;padding:20px;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);color:#fff}
.sp-back{background:linear-gradient(150deg,#1e293b,#0f172a);border:2px solid rgba(255,255,255,.12)}
.sp-back .q{font-size:70px;opacity:.9}
.sp-back b{display:block;font-size:19px;margin-top:10px}
.sp-back span{display:block;font-size:13px;opacity:.75;margin-top:6px}
.sp-front{transform:rotateY(180deg)}
.sp-front.civ{background:linear-gradient(150deg,#12a150,#0891b2)}
.sp-front.spy{background:linear-gradient(150deg,#e11d48,#7c3aed)}
.sp-front .ic{font-size:62px;line-height:1}
.sp-front h2{color:#fff;margin:8px 0 4px;font-size:clamp(20px,5vw,28px)}
.sp-front .role{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:6px 16px;
  font-size:16px;font-weight:800;margin-top:6px}
.sp-front p{margin:10px 0 0;font-size:13.5px;opacity:.92;line-height:1.5}
.sp-mates{background:rgba(0,0,0,.25);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:13.5px}
.sp-locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;margin-top:10px}
.sp-loc{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 6px;font-size:11.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);text-align:center;transition:.15s;line-height:1.3}
.sp-loc .e{display:block;font-size:19px;margin-bottom:2px}
.sp-loc.off{opacity:.35;text-decoration:line-through;background:var(--chip)}
.sp-loc.pick{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent);transform:scale(1.04)}
.sp-turn{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.sp-p{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel2);
  border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  color:var(--ink);transition:.16s}
.sp-p .av{width:26px;height:26px;min-width:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800}
.sp-p.now{border-color:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 24%,transparent);transform:translateY(-2px)}
.sp-p.sus{border-color:var(--red)}

/* ⌨️ Yozuv Marafoni kartasi */
.yzc{display:flex;align-items:center;gap:14px;margin-top:16px;padding:18px 20px;border-radius:22px;text-decoration:none;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;min-height:104px;
  background:radial-gradient(420px 200px at 0 0,#ffb347,transparent 60%),linear-gradient(120deg,#ea580c,#ff2e7e 55%,#7c3aed)}
.yzc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 22px,transparent 22px 44px);opacity:.35}
.yzc:hover{transform:translateY(-2px)}
.yzc.hot{animation:lcPulse 1.6s ease-in-out infinite}
.yzc-run{font-size:46px;flex:none;animation:yzcRun .7s ease-in-out infinite alternate;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
@keyframes yzcRun{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-5px) rotate(4deg)}}
.yzc-t{flex:1;min-width:0;display:grid;gap:3px}
.yzc-k{font-size:11.5px;font-weight:900;letter-spacing:1.5px;opacity:.92}
.yzc-t b{font-size:clamp(19px,3.2vw,25px)}
.yzc-t span:last-child{font-weight:700;opacity:.95;font-variant-numeric:tabular-nums}
.yzc-btn{flex:none;background:#fff;color:#e11d48;font-weight:900;border-radius:14px;padding:10px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
@media(max-width:480px){.yzc{flex-wrap:wrap}.yzc-run{font-size:38px}}
/* krossvord yasash */
.kv-card{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px 18px;border-radius:20px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s}
.kv-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#f59e0b,#ec4899,#7c3aed)}
.kv-card:hover{transform:translateY(-2px)}
.kv-card .kv-ic{font-size:38px;flex:none;margin-left:6px}
.kv-card div{flex:1;min-width:0;display:grid;gap:2px}.kv-card b{font-size:18px}.kv-card span:not(.kv-ic):not(.kv-go){color:var(--muted);font-size:13.5px;font-weight:600}
.kv-card .kv-go{flex:none;font-weight:800;color:var(--violet)}
.kv-wrap{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}
.kv-lb{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin:0 0 5px}
.kv-hd{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.kv-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.kv-n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--violet),var(--blue))}
.kv-f{flex:1;min-width:0;display:grid;gap:6px}
.kv-f input,.kv-f textarea{padding:8px 10px;font-size:14px;border-radius:10px}
.kv-q{resize:none;line-height:1.35;font-weight:600}
.kv-a{font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.kv-a::placeholder{text-transform:none;letter-spacing:0;font-weight:600}
.kv-st{flex:none;min-width:58px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.kv-st.ok{color:var(--ok)}.kv-st.warn{color:#b45309}
:root[data-theme="dark"] .kv-st.warn{color:var(--amber)}
.kv-x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font:inherit}
.kv-x:hover{color:var(--err);border-color:var(--err)}
.kv-x:focus-visible,.kv-row input:focus-visible,.kv-row textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.kv-paste{margin-top:10px;padding:12px;border:1.5px dashed var(--line);border-radius:14px}
.kv-tip{margin:12px 0 0}
.kv-empty{text-align:center;padding:40px 12px}
.kv-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.kv-chip{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800}
.kv-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.kv-sw{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;cursor:pointer}
.kv-sw input{width:auto;accent-color:var(--violet)}
.kv-warn{margin:0 0 10px;padding:9px 12px;border-radius:12px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45);font-size:13px}
.kv-svgw{display:flex;justify-content:center;padding:6px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.kv-svg{width:100%;height:auto;display:block}
.kv-c{fill:var(--panel);stroke:var(--ink2);stroke-width:1.6;transition:fill .12s}
.kv-c.hl{fill:color-mix(in srgb,var(--amber) 55%,var(--panel))}
.kv-cn{font:800 9.5px ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
.kv-cl{font:800 19px ui-sans-serif,system-ui,sans-serif;fill:var(--blue)}.kv-cl.sm{font-size:13.5px}
:root[data-theme="dark"] .kv-cl{fill:#8fb4ff}
.kv-lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:14px}
.kv-cl-h{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--green);margin-bottom:6px}
.kv-cl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.kv-cl li{padding:6px 9px;border-radius:10px;font-size:13.5px;line-height:1.4;cursor:default;outline:none}
.kv-cl li:hover,.kv-cl li:focus-visible{background:color-mix(in srgb,var(--amber) 22%,var(--panel))}
.kv-cl small{color:var(--muted);font-weight:700}.kv-miss{color:var(--err)}.kv-ans{font-weight:900;color:var(--blue);margin-left:4px}
@media(max-width:860px){.kv-wrap{grid-template-columns:1fr}}

/* =====================================================================

   • Yuguruvchining yo'lakdagi o'rni = matnning to'g'ri yozilgan qismi.

/* tasodifiy matn: oxirgi o'ynalganlar darhol takrorlanmaydi; vaqtga rejimida bir nechta matn ulanadi */
function pickText(l,v,minLen){
  var a=pool(l,v).slice(); if(!a.length){ l="uz"; v="orta"; a=pool(l,v).slice(); }
  if(!a.length) return "Matn topilmadi.";
  var key=l+"|"+v, lastAll=lget("yz_last_v1",{})||{}, last=lastAll[key]||[];
  var fresh=a.filter(function(s){ return last.indexOf(hash(s))<0; }); if(!fresh.length) fresh=a.slice();

  var out=[fresh[0]], len=fresh[0].length, rest=shuffle(a.filter(function(s){ return s!==fresh[0]; }));

  last=last.concat(out.map(hash)).slice(-Math.max(1,Math.floor(a.length*0.6)));
  lastAll[key]=last; lset("yz_last_v1",lastAll);
  return out.join(" ");
}

}

/* i-so'z tugagandagi belgilar soni (bo'shliqsiz) */
function charsAt(T,i){ return i<=0?0:(T.st[i-1]+T.w[i-1].length); }

var APO="'‘’ʻʼ`´′", QUO='"«»“”„';
var EQ={uzc:{"ў":"у","Ў":"У","қ":"к","Қ":"К","ғ":"г","Ғ":"Г","ҳ":"х","Ҳ":"Х","ъ":"'"},
  ru:{"ё":"е","Ё":"Е"},
  tr:{"ç":"c","Ç":"C","ğ":"g","Ğ":"G","ı":"i","İ":"I","ö":"o","Ö":"O","ş":"s","Ş":"S","ü":"u","Ü":"U","â":"a","Â":"A","î":"i","Î":"I","û":"u","Û":"U"},

var CYR=/[Ѐ-ӿ]/, LAT=/[A-Za-z]/;

/* ================== 3. XOTIRA (localStorage) ================== */
var K_PB="yz_pb_v1", K_HIST="yz_hist_v1", K_LOOK="yz_look_v1", K_SET="yz_set_v1";
function settings(){ var s=lget(K_SET,{})||{}; return {l:s.l||"uz",v:s.v||"orta",m:s.m||"fin",b:(s.b==null?3:clamp(+s.b,0,5))}; }

  var h=(lget(K_HIST,[])||[]).filter(function(x){ return x&&x.l===l&&x.c>0; }).slice(-5);
  if(!h.length) return 0;
  return h.reduce(function(s,x){ return s+x.c; },0)/h.length/60;

/* ================== 4. OVOZ (WebAudio sintez) ================== */
var SND=(function(){
  var ac=null, mg=null, NB=null, amb=null, ambG=null;

  c.fillStyle="#fff"; c.font="900 13px system-ui,Arial,sans-serif"; c.textAlign="center"; c.textBaseline="middle"; c.fillText(L("MARRA","FINISH"),a+58,TOP-91.5);
  var yt=S.laneY(0)-30*S.laneS(0), yb=S.laneY(S.nl-1)-30*S.laneS(S.nl-1);
  if(!S.tapeT){ c.strokeStyle="#ef4444"; c.lineWidth=2.2; c.setLineDash([7,5]); c.beginPath(); c.moveTo(S.sx(fx,yt)+4,yt); c.lineTo(S.sx(fx,yb)+4,yb); c.stroke();
    c.strokeStyle="#fff"; c.lineDashOffset=6; c.beginPath(); c.moveTo(S.sx(fx,yt)+4,yt); c.lineTo(S.sx(fx,yb)+4,yb); c.stroke(); c.setLineDash([]); c.lineDashOffset=0; }

    c.beginPath(); c.moveTo(S.sx(fx,yb)+4,yb); c.quadraticCurveTo(S.sx(fx,yb)+18-sw,yb+8*k,S.sx(fx,yb)+12-sw,yb+24*k); c.stroke(); }
}

/* ================== 7. YOZISH MEXANIKASI ==================
   TypeRacer uslubi: maydonga joriy so'z yoziladi. To'g'ri harflar yashil, xato — qizil;
   so'z faqat to'liq to'g'ri yozilib, bo'shliq bosilganda qabul qilinadi (xato tuzatilmaguncha oldinga o'tilmaydi). */
function mkTyper(T,box,inp,h){
  var Y={T:T,wi:0,v:"",raw:"",m:0,err:false,ok:0,bad:0,miss:{},on:false,done:false,t0:0,tEnd:0,lastWarn:0,lastLay:0};
  var lang=T.lang;
  function segN(){ return Y.wi<T.nw?nstr(segOf(T,Y.wi),lang):""; }
  function cur(){
    var sg=segOf(T,Y.wi), v=Y.v, o="";
    for(var j=0;j<sg.length;j++){
      var cl=j<Y.m?"c ok":(j<v.length?"c bad":"c");
      if(j===v.length) cl+=" cur";
      o+='<span class="'+cl+'">'+esc(sg.charAt(j))+'</span>';
    }
    if(v.length>=sg.length&&Y.raw.length>sg.length) o+='<span class="c bad x">'+esc(Y.raw.slice(sg.length))+'</span>';
    if(v.length>=sg.length) o+='<span class="c cur x0">​</span>';
    return o;
  }
  Y.render=function(){
    var a=Math.max(0,Y.wi-30), b=Math.min(T.nw,Y.wi+140), o=a>0?'<span class="w more">… </span>':'';
    for(var i=a;i<b;i++){
      if(i<Y.wi) o+='<span class="w ok">'+esc(segOf(T,i))+'</span>';
      else if(i>Y.wi) o+='<span class="w">'+esc(segOf(T,i))+'</span>';
      else o+='<span class="w cur" id="yzCur">'+cur()+'</span>';
    }
    if(b<T.nw) o+='<span class="w more"> …</span>';
    Y.a=a; Y.b=b; box.innerHTML=o; Y.scroll();
  };
  Y.paint=function(){ var c=$("yzCur"); if(c) c.innerHTML=cur(); };
  Y.scroll=function(){
    var c=$("yzCur"); if(!c) return;
    var lh=parseFloat(getComputedStyle(box).lineHeight)||28, few=box.clientHeight<lh*3.4;
    var tg=Math.max(0,c.offsetTop-(few?6:lh+4));
    if(Math.abs(box.scrollTop-tg)>3){ try{ box.scrollTo({top:tg,behavior:"smooth"}); }catch(e){ box.scrollTop=tg; } }
  };
  /* to'g'ri yozilgan belgilar (yuguruvchi shu bo'yicha yuradi) */
  Y.chars=function(){ return Y.wi>=T.nw?T.n:(T.st[Y.wi]+Math.min(Y.m,T.w[Y.wi].length)); };
  Y.stats=function(tn){
    var el=Math.max(1,(Y.done?Y.tEnd:tn)-Y.t0), pc=Y.chars();
    var wEq=Y.wi+(Y.wi<T.nw?Math.min(Y.m,T.w[Y.wi].length)/Math.max(1,T.w[Y.wi].length):0);
    return {el:el,chars:pc,words:Y.wi,wEq:wEq,wpm:el>1500?wEq*60000/el:0,cpm:el>1500?pc*60000/el:0,
      acc:(Y.ok+Y.bad)?Math.round(Y.ok*1000/(Y.ok+Y.bad))/10:100,prog:pc/T.n};
  };
  Y.start=function(t0){ Y.on=true; Y.t0=t0; inp.value=""; Y.v=""; Y.raw=""; inp.disabled=false; inp.classList.remove("err"); };
  Y.stop=function(){ Y.on=false; inp.blur(); };
  function onInput(){
    if(!Y.on||Y.done){ if(inp.value){ inp.value=""; if(h.early) h.early(); } return; }
    var raw=inp.value, nv=nstr(raw,lang), old=Y.v, sg=segN();
    /* bir urinishda 2 tadan ko'p belgi (avtomatik to'ldirish, qo'yish) yoki juda uzun xato — qabul qilinmaydi */
    if((nv.length-old.length>2&&nv.indexOf(old)===0)||nv.length>sg.length+8){
      inp.value=Y.raw;
      if(now()-Y.lastWarn>2500){ Y.lastWarn=now(); toast(L("Harflarni bittadan yozing — avtomatik to'ldirish hisobga olinmaydi","Type letter by letter — autocomplete is not counted")); }
      return;
    }
    var errNew=false;
    if(nv.length>old.length&&nv.slice(0,old.length)===old){
      var m0=0; while(m0<old.length&&m0<sg.length&&old.charAt(m0)===sg.charAt(m0)) m0++;
      for(var j=old.length;j<nv.length;j++){
        var good=(j<sg.length&&j===m0&&nv.charAt(j)===sg.charAt(j));
        if(good){ Y.ok++; m0++; }
        else {
          Y.bad++;
          if(j===m0&&!errNew){ var ex=j<sg.length?segOf(T,Y.wi).charAt(j):"⎵"; ex=ex===" "?"⎵":ex; Y.miss[ex]=(Y.miss[ex]||0)+1; errNew=true;
            var tc=raw.charAt(j), want=segOf(T,Y.wi).charAt(j);
            if(now()-Y.lastLay>4000&&((CYR.test(tc)&&LAT.test(want))||(LAT.test(tc)&&CYR.test(want)))){ Y.lastLay=now();
              if(h.hint) h.hint(CYR.test(want)?L("⌨️ Klaviaturani kirill (RU/UZ) tiliga o'tkazing","⌨️ Switch the keyboard to Cyrillic"):L("⌨️ Klaviaturani lotin (EN) tiliga o'tkazing","⌨️ Switch the keyboard to Latin")); } }
        }
      }
    }
    Y.v=nv; Y.raw=raw;
    /* to'liq to'g'ri yozilgan so'zlarni qabul qilish */
    var moved=0;
    while(Y.wi<T.nw){ var s2=segN(); if(s2&&Y.v.slice(0,s2.length)===s2){ Y.v=Y.v.slice(s2.length); Y.raw=Y.raw.slice(s2.length); Y.wi++; moved++; } else break; }
    var s3=segN(), m=0; while(m<Y.v.length&&m<s3.length&&Y.v.charAt(m)===s3.charAt(m)) m++;
    Y.m=m; Y.err=Y.v.length>m;
    if(moved){ inp.value=Y.raw; if(Y.wi>=T.nw){ Y.done=true; Y.tEnd=now(); Y.m=0; Y.render(); inp.disabled=true; inp.classList.remove("err"); if(h.done) h.done(); return; }
      if(moved>1||Y.wi>=Y.b-40||Y.wi<Y.a) Y.render(); else { var pc=$("yzCur"); if(pc){ pc.removeAttribute("id"); pc.className="w ok"; pc.textContent=segOf(T,Y.wi-moved); }
        var all=box.querySelectorAll(".w"), idx=Y.wi-Y.a+(Y.a>0?1:0); if(all[idx]){ all[idx].className="w cur"; all[idx].id="yzCur"; } Y.paint(); Y.scroll(); }
      if(h.word) h.word(); }
    else Y.paint();
    inp.classList.toggle("err",Y.err);
    if(errNew&&h.err) h.err(); else if(nv.length>old.length&&!Y.err&&h.key) h.key();
    if(h.prog) h.prog();
  }
  inp.addEventListener("input",onInput);
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); } });
  ["paste","drop","cut"].forEach(function(ev){ inp.addEventListener(ev,function(e){ e.preventDefault(); if(ev!=="cut") toast(L("Matnni qo'yib bo'lmaydi — o'zingiz yozing 🙂","Pasting is not allowed — type it yourself 🙂")); }); });
  inp.addEventListener("beforeinput",function(e){ var t=e.inputType||""; if(t==="insertFromPaste"||t==="insertFromDrop"||t==="insertReplacementText"||t==="insertFromYank") e.preventDefault(); });
  box.addEventListener("click",function(){ if(!inp.disabled) inp.focus(); });
  Y.render();
  return Y;
}

/* ================== 8. POYGA (umumiy holat) ================== */
var RC=null;           /* joriy poyga */
var BOTN=["Aziz","Madina","Javohir","Sevara","Bekzod","Nilufar","Sherzod","Gulnoza","Otabek","Zarina","Rustam","Kamola","Diyor","Shahnoza","Jahongir","Mohira"];
/* yo'lakdagi o'rin: progress (belgi) → dunyo koordinatasi */
function wx(ch){ return -20+ch*PX; }
function markList(T,mode){
  var out=[];
  if(mode==="fin"){ [.25,.5,.75].forEach(function(f){ out.push({x:wx(T.n*f),t:Math.round(f*100)+"%"}); }); }
  else { for(var k=10;k<T.nw;k+=10) out.push({x:wx(charsAt(T,k)),t:k+" "+L("so'z","words")}); }
  return out;
}
function mkRace(o){
  var T=mkText(o.text,o.lang);
  return {kind:o.kind,lang:o.lang,lvl:o.lvl,mk:o.mk,mode:o.mode,dur:o.dur||0,T:T,t0:0,started:false,over:false,
    samples:[],rs:[],me:null,bots:[],ghost:null,scene:null,ty:null,finMs:0,lastPlace:0,key:o.key||null,meta:o.meta||null,
    lastSample:0,botsN:o.bots||0,pb:o.pb||null};
}
function wordsAt(T,c){ var lo=0, hi=T.nw; while(lo<hi){ var m=(lo+hi)>>1; if(T.st[m]+T.w[m].length<=c) lo=m+1; else hi=m; } return lo; }
/* bot: tezligi o'yinchining odatiy tezligi atrofida, so'z oxirida ba'zan "xato qilib" to'xtab qoladi */
function mkBot(i,f,base,used){
  var nm=BOTN.filter(function(x){ return used.indexOf(x)<0; }); nm=nm.length?pick(nm):pick(BOTN); used.push(nm);
  return {n:nm,cps:base*f*rnd(.96,1.04),p:0,pause:0,done:false,tDone:0,wob:rnd(0,6),acc:Math.round(rnd(91,99.4)*10)/10};
}
function botStep(b,dt,T,el){
  if(b.done) return;
  if(b.pause>0){ b.pause-=dt; return; }
  var before=b.p; b.p+=b.cps*(1+.2*Math.sin(el/1000*1.25+b.wob))*dt;
  if(wordsAt(T,before)!==wordsAt(T,b.p)&&Math.random()<.075) b.pause=rnd(.3,1.05);
  if(b.p>=T.n){ b.p=T.n; b.done=true; b.tDone=el; }
}

/* ================== 9. ANIMATSIYA SIKLI (60 fps) ================== */
var LOOP={fn:[],raf:0,last:0,fps:60};
function loopOn(fn){ LOOP.fn.push(fn); if(!LOOP.raf){ LOOP.last=now(); LOOP.raf=requestAnimationFrame(loopTick); } }
function loopOff(){ LOOP.fn=[]; if(LOOP.raf) cancelAnimationFrame(LOOP.raf); LOOP.raf=0; }
function loopTick(){
  var t=now(), dt=Math.min(.05,Math.max(0,(t-LOOP.last)/1000)); LOOP.last=t;
  if(dt>0) LOOP.fps=LOOP.fps*.94+(1/dt)*.06;
  for(var i=0;i<LOOP.fn.length;i++){ try{ LOOP.fn[i](dt,t); }catch(e){ if(window.console) console.error(e); } }
  LOOP.raf=LOOP.fn.length?requestAnimationFrame(loopTick):0;
}

/* ================== 10. EKRANLAR ================== */
var OFF=[];          /* ko'rinishdan chiqqanda olib tashlanadigan tinglovchilar */
function on(el,ev,fn,o){ el.addEventListener(ev,fn,o); OFF.push(function(){ el.removeEventListener(ev,fn,o); }); }
function leave(){
  stopTimers(); loopOff(); OFF.forEach(function(f){ try{ f(); }catch(e){} }); OFF=[];
  SCENES.forEach(function(S){ if(S.ro) S.ro.disconnect(); }); SCENES=[];
  document.documentElement.classList.remove("yz-lock"); SND.amb(0);
  if(RC&&RC.ty) RC.ty.on=false;
}
function sndIc(){ return (X&&X.FX&&X.FX.isMuted())?"🔇":"🔊"; }
function bindSnd(id){
  var b=$(id); if(!b) return;
  b.onclick=function(){
    var m=!X.FX.isMuted(); X.FX.mute(m); b.textContent=sndIc();
    var tb=document.getElementById("btnSnd"); if(tb) tb.textContent=m?"🔇":"🔊";
    if(!m){ SND.unlock(); SND.tick(); }
    SND.amb(!m&&RC&&RC.started&&!RC.over&&VIEW==="race"?.016:0);

function raceFrame(R,dt){
  var S=R.scene; if(!S||RC!==R) return;
  S.fit();
  if(R.started&&!R.over){
    var el=now()-R.t0;
    R.bots.forEach(function(b){ botStep(b,dt,R.T,el); b.r.tx=b.r.fin?b.r.tx:wx(b.p); if(b.done&&!b.r.fin) runnerFin(R,b.r); });
    if(R.ghost){ var gp=Math.min(R.T.n,R.ghost.cps*el/1000); if(!R.ghost.r.fin) R.ghost.r.tx=wx(gp); if(gp>=R.T.n&&!R.ghost.r.fin) runnerFin(R,R.ghost.r,true); }
    if(R.mode==="time"&&el>=R.dur*1000&&R.kind==="prac") timeUp(R);
  }
  if(R.kind==="live") liveFrame(R,dt);
  /* marradan keyin sekinlashib yugurib, so'ng quvonadi */
  S.rs.forEach(function(r){ if(r.fin&&r.ro!=null){ r.ro+=r.rov*dt; r.rov*=Math.exp(-dt*1.35); r.tx=r.fx+r.ro; if(r.rov<16&&!r.win&&r.place&&r.place<=3&&!r.ghost) r.win=true; } });

function runnerFin(R,r,ghost){
  if(r.fin) return;
  r.fin=true; r.fx=r.tx; r.ro=0; r.rov=Math.max(PX*2.2,r.vs*.9);
  if(!ghost){ R.finN=(R.finN||0)+1; r.place=R.finN; }
  var S=R.scene; if(!S.tapeT&&!ghost){ S.tapeT=S.t; S.cheer(1.2); SND.cheer(false); }
}
function meDone(R){
  if(R.meDone) return;
  R.meDone=true; R.finMs=now()-R.t0; R.endEl=R.finMs;
  var r=R.me; runnerFin(R,r);
  SND.fin(); SND.cheer(true); R.scene.cheer(1.6); R.scene.burst(R.scene.sx(r.x,r.ly),r.ly-70,120);
  pop(r.place===1?"🥇 "+L("Birinchi!","First!"):"🏁 "+L("Marra!","Finish!"),"big");
  R.ty.stop(); SND.amb(.03);
  if(R.kind==="prac") later(function(){ pracResults(R); },2600);
  else liveMeDone(R);
}
function timeUp(R){
  if(R.over) return;
  R.over=true; R.endEl=R.dur*1000;
  if(R.ty){ if(!R.ty.done){ R.ty.done=true; R.ty.tEnd=R.t0+R.dur*1000; } R.ty.stop(); }
  var inp=$("yzIn"); if(inp) inp.disabled=true;
  SND.beep(true); SND.cheer(true);
  var cd=$("yzCd"); if(cd) cd.innerHTML='<b class="tu">⏱ '+L("VAQT TUGADI!","TIME!")+'</b>';
  /* eng uzoqqa yetgan quvonadi */
  var best=null; R.scene.rs.forEach(function(r){ if(!r.ghost&&(!best||r.tx>best.tx)) best=r; }); if(best){ best.place=1; best.win=true; }
  if(R.kind==="prac") later(function(){ pracResults(R); },2200);
}
function placeNow(R){
  if(R.kind==="live") return livePlace(R);
  var c=R.ty.chars(), fin=R.ty.done&&R.mode==="fin", pl=1, n=1;
  R.bots.forEach(function(b){ n++; if(fin){ if(b.done&&b.tDone<R.finMs) pl++; } else if(b.done||b.p>c) pl++; });
  return {pl:pl,n:n};
}
function raceStats(R){
  if(RC!==R) return;
  if(!R.ty){ if(R.kind==="live"){ liveSide(R); var ck0=$("yzClock"), t0=X.snow(), m0=R.meta; if(ck0) setTxt("yzClock",t0<m0.start?"⏳ "+X.kLeft(m0.start-t0):"⏱ "+fmtT(t0-m0.start)); } return; }
  var st=R.ty.stats(now()), el=R.started?(R.meDone||R.over?R.endEl:st.el):0, time=R.mode==="time";
  setTxt("yzWpm",R.started?Math.round(st.wpm):0);
  setTxt("yzAcc",st.acc+"%");
  setTxt("yzTm",fmtT(el));
  setTxt("yzPr",time?String(st.words):Math.floor(st.prog*100)+"%");
  var left=time?Math.max(0,R.dur*1000-el):el, ck=$("yzClock");
  if(ck){ setTxt("yzClock",(time?"⏳ ":"⏱ ")+fmtT(left)); ck.classList.toggle("low",time&&R.started&&left<10000); }
  var b=$("yzBar"); if(b) b.style.width=(time?clamp(el/(R.dur*1000),0,1):st.prog)*100+"%";
  if(R.started){
    var p=placeNow(R); setTxt("yzPl",p.pl+"/"+p.n);
    if(R.lastPlace&&p.pl<R.lastPlace&&el>1500&&!R.meDone){ SND.over(); pop("⬆ "+p.pl+"-"+L("o'rin!","place!"),"up"); R.scene.cheer(.5); }
    R.lastPlace=p.pl;
    if(!R.meDone&&!R.over&&el-R.lastSample>=1000){ R.lastSample=el; R.samples.push({t:el,w:st.wpm,c:st.chars}); }
    if(!R.tagAt||el-R.tagAt>500){ R.tagAt=el; if(R.me) R.me.tagTxt=firstName(myName())+(st.wpm>0?" · "+Math.round(st.wpm):"");
      R.bots.forEach(function(bb){ var w=bb.p>0?Math.round(wordsAt(R.T,bb.p)*60000/Math.max(1000,bb.done?bb.tDone:el)):0; bb.r.tagTxt=bb.n+(w?" · "+w:""); }); }
  }
  if(R.kind==="live") liveStats(R,st);
}

/* ---------- 10.4 Mashq natijasi ---------- */
function pracResults(R){
  if(R.resDone||RC!==R) return; R.resDone=true;
  var T=R.T, st=R.ty.stats(now()), time=R.mode==="time", myMs=time?R.dur*1000:(R.finMs||st.el), elNow=now()-R.t0;
  var rows=[{me:true,n:myName(),lk:R.me.lk,num:R.me.num,ch:st.chars,w:time?wordsAt(T,st.chars):T.nw,ms:myMs,acc:st.acc,fin:!time}];
  R.bots.forEach(function(b){
    var ms,ch,est=false;
    if(time){ ch=Math.floor(b.p); ms=R.dur*1000; }
    else if(b.done){ ch=T.n; ms=b.tDone; }
    else { ch=T.n; ms=elNow+(T.n-b.p)/b.cps*1000; est=true; }      /* hali yugurayotgan bot: taxminiy marra vaqti */
    rows.push({bot:true,n:b.n,lk:b.r.lk,num:b.r.num,ch:ch,w:time?wordsAt(T,ch):T.nw,ms:ms,acc:b.acc,fin:!time,est:est});
  });
  rows.forEach(function(r){ r.wpm=Math.round(r.w*60000/Math.max(1000,r.ms)); });
  rows.sort(time?function(a,b){ return (b.ch-a.ch)||(a.me?-1:1); }:function(a,b){ return a.ms-b.ms; });
  rows.forEach(function(r,i){ r.place=i+1; });
  var mine=rows.filter(function(r){ return r.me; })[0], cpm=Math.round(st.chars*60000/Math.max(1000,myMs));
  var my={wpm:mine.wpm,acc:st.acc,ms:myMs,words:mine.w,chars:st.chars,cpm:cpm,place:mine.place,n:rows.length};
  var prev=pbGet(R.lang,R.lvl,R.mk), isPB=mine.w>0&&pbSave(R.lang,R.lvl,R.mk,{w:my.wpm,a:my.acc,c:cpm,t:myMs,at:Date.now()});
  histAdd({at:Date.now(),l:R.lang,v:R.lvl,m:R.mk,w:my.wpm,a:my.acc,c:cpm,pl:my.place,n:my.n});
  if(isPB) recPush(R.lang,R.lvl,R.mk,my);
  vResults({R:R,rows:rows,my:my,isPB:isPB,prev:prev,kind:"prac"});
}
function recPush(l,v,m,my){
  var me=ME(); if(!me||!X.online()||my.acc<70) return;
  var all=lget(K_PB,{})||{}, best=0; Object.keys(all).forEach(function(k){ if(k.indexOf(l+"|")===0) best=Math.max(best,+all[k].w||0); });
  if(my.wpm<best) return;
  X.DB.set("yzrec/"+l+"/"+me.id,{n:myName().slice(0,40),w:my.wpm,a:my.acc,v:v,m:m,av:myLook(),at:Date.now()});
}

/* tezlik grafigi (so'z/daqiqa vaqt bo'yicha) */
function chart(R){
  var cv=$("yzChart"); if(!cv) return;
  var dpr=Math.min(2,window.devicePixelRatio||1), w=cv.clientWidth||320, h=cv.clientHeight||170;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  var c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  var sm=(R.samples||[]).filter(function(p){ return p.t>=2000; });
  var dark=document.documentElement.getAttribute("data-theme")==="dark", ink=dark?"#9db0cd":"#5b6b82", grid=dark?"rgba(255,255,255,.08)":"rgba(13,27,42,.08)";
  if(sm.length<2){ c.fillStyle=ink; c.font="600 13px system-ui,Arial"; c.textAlign="center"; c.fillText(L("Grafik uchun poyga juda qisqa bo'ldi","The race was too short for a chart"),w/2,h/2); return; }
  /* oniy tezlik: so'nggi 4 soniyadagi belgilar → so'z (matnning o'rtacha so'z uzunligi bilan) */
  var cpw=R.T.n/R.T.nw, pts=sm.map(function(p,i){ var j=i; while(j>0&&p.t-sm[j-1].t<=4000) j--; var q=j<i?sm[j]:{t:0,c:0};
    return {t:p.t,v:Math.max(0,(p.c-q.c)/cpw*60000/Math.max(500,p.t-q.t))}; });
  var mx=Math.max(20,Math.ceil(Math.max.apply(null,pts.map(function(p){ return p.v; }))/20)*20), t1=pts[pts.length-1].t, pl=34, pr=10, pt=10, pb=22;
  function X_(t){ return pl+(w-pl-pr)*t/t1; } function Y_(v){ return pt+(h-pt-pb)*(1-v/mx); }
  c.strokeStyle=grid; c.lineWidth=1; c.fillStyle=ink; c.font="600 11px system-ui,Arial"; c.textAlign="right"; c.textBaseline="middle";
  for(var g=0;g<=4;g++){ var v=mx*g/4, y=Y_(v); c.beginPath(); c.moveTo(pl,y); c.lineTo(w-pr,y); c.stroke(); c.fillText(Math.round(v),pl-6,y); }
  c.textAlign="center"; c.textBaseline="top"; c.fillText("0:00",pl,h-pb+6); c.fillText(fmtT(t1),w-pr-12,h-pb+6);
  var gr=c.createLinearGradient(0,pt,0,h-pb); gr.addColorStop(0,"rgba(255,90,31,.45)"); gr.addColorStop(1,"rgba(124,58,237,.03)");
  c.beginPath(); c.moveTo(X_(pts[0].t),h-pb); pts.forEach(function(p){ c.lineTo(X_(p.t),Y_(p.v)); }); c.lineTo(X_(t1),h-pb); c.closePath(); c.fillStyle=gr; c.fill();
  c.beginPath(); pts.forEach(function(p,i){ if(i) c.lineTo(X_(p.t),Y_(p.v)); else c.moveTo(X_(p.t),Y_(p.v)); });
  var lg=c.createLinearGradient(pl,0,w,0); lg.addColorStop(0,"#ff7a18"); lg.addColorStop(.6,"#ff2e7e"); lg.addColorStop(1,"#7c3aed");
  c.strokeStyle=lg; c.lineWidth=3; c.lineJoin="round"; c.stroke();
  var avg=pts.reduce(function(s,p){ return s+p.v; },0)/pts.length;
  c.setLineDash([6,5]); c.strokeStyle=dark?"rgba(255,255,255,.45)":"rgba(13,27,42,.4)"; c.lineWidth=1.4; c.beginPath(); c.moveTo(pl,Y_(avg)); c.lineTo(w-pr,Y_(avg)); c.stroke(); c.setLineDash([]);
  c.fillStyle=ink; c.textAlign="left"; c.textBaseline="bottom"; c.fillText(L("o'rtacha","average")+" "+Math.round(avg),pl+6,Y_(avg)-3);
}

/* ================== 11. JONLI POYGA ==================
   Vaqt hamma joyda server soati bilan (X.snow()). Bosqichlar:
   lobbi (meta.open … start) → 3-2-1 → poyga (start … start+dur) → rasmiy natija (meta.end dan keyin). */
var LIVE={g:null,joined:{}};
function dayLbl(ms){ var d=X.kday(ms), t=X.kday(X.snow()), tm=X.kday(X.snow()+86400000);
  return (d===t?L("Bugun","Today"):d===tm?L("Ertaga","Tomorrow"):d.slice(8,10)+"."+d.slice(5,7))+" "+X.kHM(ms); }
function liveMk(m){ return m.mode==="time"?("t"+(+m.dur||60)):"fin"; }
function liveFind(cb){
  if(!X.online()||!X.base()){ cb(null); return; }
  var q='?orderBy='+encodeURIComponent('"$key"')+'&startAt='+encodeURIComponent('"'+X.kday(X.snow()-86400000)+'"')+'&limitToFirst=20';
  X.tmo(fetch(X.base()+"/kahoot/idx.json"+q),9000).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(idx){
    var t=X.snow(), list=Object.keys(idx||{}).map(function(k){ var e=idx[k]; if(e&&typeof e==="object") e.d=k; return e; })
      .filter(function(e){ return e&&e.type==="yz"&&+e.end+15*60000>t; }).sort(function(a,b){ return a.start-b.start; });
    var g=list[0]; if(!g){ cb(null); return; }
    X.kget("games/"+g.d+"/meta",function(m){ cb(m&&m.type==="yz"?{d:g.d,m:m}:null); });
  });
}

function liveCard(){

  if(!X.online()){ box.innerHTML='<div class="yz-lc none">🔌 '+L("Internet yo'q — jonli poyga ko'rinmaydi, mashq qilish mumkin.","Offline — live races are hidden, practice works.")+'</div>'; return; }
  var a=ALIVE, me=ME();
  function load(){
    liveFind(function(g){
      if(a!==ALIVE) return;
      LIVE.g=g;
      if(g&&me&&!LIVE.joined[g.d]) X.kget("games/"+g.d+"/p/"+me.id,function(v){ if(v) LIVE.joined[g.d]=true; draw(); });
      draw();
    });
  }
  function draw(){
    var b=$("yzLive"); if(!b||a!==ALIVE) return;
    var g=LIVE.g, t=X.snow();
    if(!g){ var h0='<div class="yz-lc none">🗓 '+L("Hozircha jonli poyga e'lon qilinmagan. O'qituvchi tashkil etsa, shu yerda chiqadi va hamma qo'shila oladi. Ungacha mashq qiling!","No live race yet. When the teacher sets one up it shows here and everyone can join. Practice meanwhile!")+'</div>';
      if(b._h!==h0){ b.innerHTML=h0; b._h=h0; } return; }
    var m=g.m, jn=!!LIVE.joined[g.d], cls, t1, t2, btn="", act="";

function liveFrame(R,dt){

   O'rin: eng uzoq yetgan nazorat nuqtasi (ko'p so'z) → unga ertaroq yetgan → oldinroq qo'shilgan.

function yzWords(t){ return String(t||"").split(" ").filter(function(w){ return w.length>0; }); }
function yzScore(g){
  var m=(g&&g.meta)||{}, P=(g&&g.p)||{}, A=(g&&g.a)||{}, st=+m.start||0, W=+m.nw||0;
  /* vaqtga rejimida taymer tugagach 1,5 soniyagacha kelgan yozuv hisobga olinadi (tarmoq kechikishi) */

  var rows=Object.keys(P).map(function(sid){
    var pp=P[sid]||{}, r={sid:sid,n:pp.n||"?",g:pp.g||"",at:+pp.at||0,w:0,t:0,ch:0,fin:false,sus:false,wpm:0,s:0};
    for(var i=W;i>=1;i--){
      var a=(A[i]||{})[sid], ta=a?+a.t:0;
      if(ta&&ta>=st&&ta<=lim){ r.w=i; r.t=ta-st; break; }
    }
    if(r.w){
      r.ch=cum[r.w-1]||0; r.fin=(r.w===W);
      if(r.t<=0||(r.ch>=20&&r.ch/(r.t/1000)>15)) r.sus=true;
      r.wpm=r.t>0?Math.round(r.w*60000/r.t):0;
    }
    r.s=r.w;
    return r;
  });
  rows.sort(function(x,y){ return (x.sus-y.sus)||(y.w-x.w)||(x.t-y.t)||(x.at-y.at)||(x.sid<y.sid?-1:1); });
