<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O'yin Arenasi — TerDU</title>
<meta name="description" content="Tadbirkorlik asoslari · talabalar o'rtasidagi kichik musobaqalar: 10 ta mini-o'yin, xona kodi, jonli reyting.">
<link rel="icon" href="logo_tersu.png">
<style>
:root{
  --bg:#eef3fb; --bg2:#e6ecf9;
  --panel:#ffffff; --panel2:#f7f9fe;
  --ink:#0d1b2a; --ink2:#1f2d3d; --muted:#5b6b82;
  --line:#e1e8f4; --shadow:0 18px 40px -18px rgba(13,27,42,.35);
  --green:#12a150; --green2:#0b7a3c;
  --orange:#f97316; --amber:#f59e0b;
  --violet:#7c3aed; --pink:#ec4899;
  --blue:#2563eb; --cyan:#0891b2;
  --red:#e11d48; --teal:#0d9488;
  --chip:#f1f5fd; --ok:#12a150; --err:#e11d48;
}
:root[data-theme="dark"]{
  --bg:#080f1d; --bg2:#0d1728;
  --panel:#111b2e; --panel2:#0e1726;
  --ink:#eaf1ff; --ink2:#dbe6fb; --muted:#9db0cd;
  --line:#22304c; --shadow:0 18px 44px -18px rgba(0,0,0,.75);
  --green:#2ee07f; --green2:#12a150; --chip:#16223a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
a{color:var(--blue)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:contain;background:#fff}
.brand b{display:block;font-size:13.5px;letter-spacing:.3px}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.topbar .spacer{flex:1}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:.16s;text-decoration:none}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.accent{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border-color:transparent}
.btn.vio{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;border-color:transparent}
.btn.warn{background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;border-color:transparent}
.btn.ghost{background:var(--panel2)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kicker{display:inline-block;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;
  border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.grad{background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:clamp(24px,4vw,38px)}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.gcard:hover{transform:translateY(-3px);border-color:var(--violet);box-shadow:var(--shadow)}
.gcard.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--panel))}
.gcard .ic{font-size:26px;display:block;margin-bottom:6px}
.gcard b{display:block;font-size:14.5px;margin-bottom:3px}
.gcard span{display:block;font-size:11.8px;color:var(--muted);line-height:1.45}
.gcard .tick{position:absolute;top:8px;right:9px;font-size:15px;opacity:0}
.gcard.on .tick{opacity:1}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--panel2);color:var(--ink);font-size:15px;font-weight:600;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:800;letter-spacing:7px;
  background:var(--chip);border-radius:14px;padding:10px 16px;display:inline-block}
.plist{display:grid;gap:10px}
.pl{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px}
.pl.empty{opacity:.5;border-style:dashed}
.pl .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:none}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:14.5px}
.pl .nm span{display:block;font-size:11.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--muted)}
.tag.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tag.host{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--orange)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;padding:10px 12px;text-align:left}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:10px 12px;border-bottom:1px solid var(--line)}
tr.me td{background:color-mix(in srgb,var(--green) 12%,transparent);font-weight:700}
.tw{overflow-x:auto}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}
.cd{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,10,20,.86);color:#fff}
.cd b{font-size:clamp(70px,22vw,180px);font-weight:900;animation:pop .8s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:22px;z-index:95;
  background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;font-weight:800;padding:11px 20px;
  border-radius:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:11px 15px;margin-bottom:14px;position:sticky;top:62px;z-index:30}
.hud .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;font-weight:800;min-width:52px;text-align:center}
.hud .t.low{color:var(--red)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.center{text-align:center}
.big{font-size:clamp(30px,7vw,56px);font-weight:900;line-height:1.1}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:13px;padding:13px 15px;margin-bottom:9px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s}
.opt:hover{border-color:var(--blue)}
.opt.pick{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.wr{display:grid;gap:6px;justify-content:center;margin:12px 0}
.wrow{display:flex;gap:6px}
.wc{width:clamp(38px,11vw,54px);height:clamp(38px,11vw,54px);border:2px solid var(--line);border-radius:10px;
  display:grid;place-items:center;font-size:clamp(18px,5vw,26px);font-weight:800;text-transform:uppercase;background:var(--panel2)}
.wc.g{background:var(--green);border-color:var(--green);color:#fff}
.wc.y{background:var(--amber);border-color:var(--amber);color:#fff}
.wc.b{background:var(--muted);border-color:var(--muted);color:#fff;opacity:.65}
.kb{display:grid;gap:5px;margin-top:10px}
.kbr{display:flex;gap:4px;justify-content:center}
.key{min-width:clamp(26px,7.4vw,38px);padding:10px 4px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.key.g{background:var(--green);color:#fff}.key.y{background:var(--amber);color:#fff}.key.b{opacity:.4}
.key.w{min-width:52px;font-size:11.5px}
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--chip);padding:8px;border-radius:14px;
  max-width:340px;margin:0 auto;touch-action:none;user-select:none}
.t2{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:clamp(16px,5vw,24px);
  background:var(--panel2);color:var(--ink);transition:.1s}
canvas{max-width:100%;border-radius:14px;background:var(--panel2);touch-action:none;display:block;margin:0 auto}
.wclue{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;border-radius:14px;
  padding:11px 14px;margin:0 auto 12px;max-width:440px;text-align:center;font-size:14.5px;font-weight:600;line-height:1.45}
.mem{display:grid;gap:12px;max-width:620px;margin:0 auto}
.mc{aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;font-family:inherit;
  perspective:800px;-webkit-tap-highlight-color:transparent}
.mc .f{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d}
.mc.up .f,.mc.done .f{transform:rotateY(180deg)}
.mc .a,.mc .b2{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;
  backface-visibility:hidden;box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.mc .a{background:linear-gradient(135deg,var(--violet),var(--blue));color:rgba(255,255,255,.85);font-size:clamp(22px,6vw,32px)}
.mc .b2{background:var(--panel);border:2px solid var(--line);transform:rotateY(180deg);
  font-size:clamp(40px,13vw,72px);line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.18)}
/* 3D ba'zi brauzerlarda ishlamasligi mumkin — ko'rinishni sinf bilan ham boshqaramiz */
.mc .b2{opacity:0;transition:opacity 0s linear .2s}
.mc.up .b2,.mc.done .b2{opacity:1}
.mc .a{opacity:1;transition:opacity 0s linear .2s}
.mc.up .a,.mc.done .a{opacity:0}
.mc.done .b2{background:color-mix(in srgb,var(--green) 18%,transparent);border-color:var(--green)}
.mc:not(.done):not(.up):hover .f{transform:scale(1.04)}
.mc.done{cursor:default}
@media(max-width:520px){ .mem{gap:9px;max-width:100%} }
.typ{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:17px;
  line-height:1.75;letter-spacing:.2px;min-height:90px}
.typ i{font-style:normal}
.typ i.ok{color:var(--green)}
.typ i.no{background:color-mix(in srgb,var(--red) 25%,transparent);border-radius:3px}
.typ i.cur{border-bottom:3px solid var(--blue)}
.rx{height:min(46vh,300px);border-radius:18px;display:grid;place-items:center;font-size:clamp(20px,5vw,30px);
  font-weight:800;color:#fff;cursor:pointer;user-select:none;text-align:center;padding:16px}
.rx.wait{background:linear-gradient(135deg,#334155,#1e293b)}
.rx.go{background:linear-gradient(135deg,var(--green),var(--teal))}
.rx.bad{background:linear-gradient(135deg,var(--red),var(--pink))}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.tc{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);
  font-size:clamp(30px,9vw,46px);font-weight:900;cursor:pointer;font-family:inherit;color:var(--ink)}
.tc:disabled{cursor:default}
.tc.x{color:var(--blue)}.tc.o{color:var(--pink)}
.dd{display:grid;gap:10px}
.ddtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
.chatbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;height:150px;
  overflow-y:auto;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.chatbox .g{color:var(--green);font-weight:700}
.rank{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:14px;background:var(--panel2);
  border:1px solid var(--line);margin-bottom:8px}
.rank .pos{font-size:19px;width:34px;text-align:center;font-weight:800}
.rank .pts{font-weight:800;color:var(--green);font-size:17px}
.win{background:linear-gradient(135deg,var(--amber),var(--orange));color:#fff;border-radius:20px;padding:22px;text-align:center}
.win .big{font-size:clamp(26px,6vw,44px)}
@media(max-width:700px){
  .wrap{padding:14px 12px 50px}
  .hud{top:56px;padding:9px 12px;gap:9px}
  .brand span{display:none}
}

/* ===== o'yin effektlari ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:88;display:none;background:transparent;border-radius:0;max-width:none;margin:0}
.stage{position:relative;overflow:hidden}
.stage.gb::before{content:"";position:absolute;inset:0;z-index:0;opacity:.5;
  background:radial-gradient(circle at 15% 20%,var(--c1),transparent 45%),radial-gradient(circle at 85% 75%,var(--c2),transparent 45%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.25) rotate(6deg)}}
.stage>*{position:relative;z-index:1}
.pop{position:fixed;z-index:92;font-weight:900;font-size:26px;color:var(--green);pointer-events:none;
  text-shadow:0 2px 10px rgba(0,0,0,.25);animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-64px) scale(1.25);opacity:0}}
.shake{animation:shk .36s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ring{width:52px;height:52px;flex:none}
.ring circle{fill:none;stroke-width:6;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .bgc{stroke:var(--chip)}
.ring .fgc{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.opps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opp{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px 3px 3px;font-size:12px;font-weight:700}
.opp .av{width:24px;height:24px;min-width:24px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:#fff}
.opp .pb{width:46px;height:5px;border-radius:9px;background:var(--chip);overflow:hidden}
.opp .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .4s}
.opp.done{border-color:var(--green)}
.streak{display:inline-block;background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;
  border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;animation:pop2 .3s}
@keyframes pop2{from{transform:scale(.5)}to{transform:scale(1)}}
.t2{animation:tin .18s}
@keyframes tin{from{transform:scale(.6);opacity:.4}to{transform:scale(1);opacity:1}}
.t2.mg{animation:tmg .22s}
@keyframes tmg{50%{transform:scale(1.18)}}
.wc.fl{animation:flip .45s}
@keyframes flip{50%{transform:rotateX(90deg)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:12px auto 0}
.pad button{padding:15px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  font-size:20px;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer}
.pad button:active{background:var(--chip)}
.pad .ok{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border-color:transparent}
.pad .del{background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;border-color:transparent}
.hint{display:inline-flex;gap:5px;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:5px}
.wline{position:absolute;height:6px;border-radius:6px;background:var(--green);transform-origin:0 50%;animation:grow .4s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.lvl{display:flex;gap:4px;align-items:center}
.lvl i{width:9px;height:9px;border-radius:50%;background:var(--chip);display:block}
.lvl i.on{background:var(--amber)}
.rt-diag{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}

/* ===== JOSUS ===== */
.sp-wrap{max-width:620px;margin:0 auto}
.sp-card{perspective:1200px;height:300px;margin:0 auto;max-width:380px;cursor:pointer}
.sp-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.sp-card.open .sp-inner{transform:rotateY(180deg)}
.sp-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;
  text-align:center;padding:20px;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);color:#fff}
.sp-back{background:linear-gradient(150deg,#1e293b,#0f172a);border:2px solid rgba(255,255,255,.12)}
.sp-back .q{font-size:70px;opacity:.9}
.sp-back b{display:block;font-size:19px;margin-top:10px}
.sp-back span{display:block;font-size:13px;opacity:.75;margin-top:6px}
.sp-front{transform:rotateY(180deg)}
.sp-front.civ{background:linear-gradient(150deg,#12a150,#0891b2)}
.sp-front.spy{background:linear-gradient(150deg,#e11d48,#7c3aed)}
.sp-front .ic{font-size:62px;line-height:1}
.sp-front h2{color:#fff;margin:8px 0 4px;font-size:clamp(20px,5vw,28px)}
.sp-front .role{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:6px 16px;
  font-size:16px;font-weight:800;margin-top:6px}
.sp-front p{margin:10px 0 0;font-size:13.5px;opacity:.92;line-height:1.5}
.sp-mates{background:rgba(0,0,0,.25);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:13.5px}
.sp-locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;margin-top:10px}
.sp-loc{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 6px;font-size:11.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);text-align:center;transition:.15s;line-height:1.3}
.sp-loc .e{display:block;font-size:19px;margin-bottom:2px}
.sp-loc.off{opacity:.35;text-decoration:line-through;background:var(--chip)}
.sp-loc.pick{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent);transform:scale(1.04)}
.sp-turn{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.sp-p{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel2);
  border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  color:var(--ink);transition:.16s}
.sp-p .av{width:26px;height:26px;min-width:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800}
.sp-p.now{border-color:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 24%,transparent);transform:translateY(-2px)}
.sp-p.sus{border-color:var(--red)}

/* ===== ARENA OCHIQ/YOPIQ =====

   Ochish uchun: true qiling (engine_js.txt dagi ARENA_OPEN ham). */
var ARENA_OPEN=true;
var BASE=null, online=false;
function bases(){
  var o=[];
  if(CFG.url) o.push(CFG.url.replace(/\/+$/,""));
  CFG.regions.forEach(function(r){ var u="https://"+CFG.db+"."+r+".firebasedatabase.app"; if(o.indexOf(u)<0) o.push(u); });
  o.push("https://"+CFG.db+".firebaseio.com");

function connect(done){
  var saved=null; try{ saved=localStorage.getItem("terdu_base"); }catch(e){}
  var list=bases();
  if(saved&&list.indexOf(saved)>=0) list=[saved].concat(list.filter(function(x){return x!==saved}));
  else if(saved){ try{ localStorage.removeItem("terdu_base"); }catch(e){} }
  var i=0;
  (function next(){
    if(i>=list.length){ done(false); return; }
    var b=list[i++], fin=false, t=setTimeout(function(){ if(!fin){fin=true;next();} },5000);
    fetch(b+"/arena.json?shallow=true").then(function(r){
      if(fin) return; fin=true; clearTimeout(t);
      if(r.status===200){ BASE=b; online=true; try{localStorage.setItem("terdu_base",b)}catch(e){} done(true); }
      else if(r.status===401||r.status===403){ BASE=b; done(false,"rules"); }
      else next();
    }).catch(function(){ if(!fin){fin=true;clearTimeout(t);next();} });
  })();
}
var LASTERR="", TRIED={}, RECON=false;
function reqRaw(m,path,body,cb){
  var o={method:m};
  /* DIQQAT: GET va DELETE so'roviga tana (body) qo'shib bo'lmaydi —
     brauzer 'Request with GET method cannot have body' deb so'rovni rad etadi. */
  if(body!==undefined&&(m==="PUT"||m==="PATCH"||m==="POST")){
    o.headers={"Content-Type":"application/json"}; o.body=JSON.stringify(body);
  }
  var url=BASE+"/arena/"+path+".json";
  try{
    var status=0;
    fetch(url,o).then(function(r){ status=r.status; return r.text(); })
     .then(function(t){
       if(status<200||status>=300){ if(!RECON) LASTERR=status+" · "+url.replace(/^https:\/\//,"").slice(0,44)+" · "+String(t||"").slice(0,90); cb(null,status,t); return; }
       var v=null; try{ v=t?JSON.parse(t):null; }catch(e){}
       cb(v,status,t);
     })
     .catch(function(){ if(!RECON) LASTERR=L("tarmoq xatosi","network error")+" · "+url.replace(/^https:\/\//,"").slice(0,44); cb(null,0,"net"); });
  }catch(e){ LASTERR=L("tarmoq xatosi","network error"); cb(null,0,"net"); }
}
/* boshqa manzilga o'tib qayta urinish (baza regioni noto'g'ri tanlangan bo'lsa) */
function failover(done){
  if(RECON){ done(false); return; }
  RECON=true;
  var list=bases().filter(function(b){ return b!==BASE&&!TRIED[b]; });
  var i=0;
  (function next(){
    if(i>=list.length){ RECON=false; done(false); return; }
    var b=list[i++]; TRIED[b]=1;
    var fin2=false, t=setTimeout(function(){ if(!fin2){fin2=true;next();} },4500);
    fetch(b+"/arena.json?shallow=true").then(function(r){
      if(fin2) return; fin2=true; clearTimeout(t);
      if(r.status===200){ BASE=b; online=true; try{localStorage.setItem("terdu_base",b)}catch(e){}
        RECON=false; done(true); }
      else next();
    }).catch(function(){ if(!fin2){fin2=true;clearTimeout(t);next();} });
  })();
}
function req(m,path,body,cb){
  if(!BASE){ cb&&cb(null,0,"no-base"); return; }
  reqRaw(m,path,body,function(v,st,t){
    if(v===null&&(st===0||st===404)){
      failover(function(ok){
        if(ok) reqRaw(m,path,body,function(v2,st2,t2){ cb&&cb(v2,st2,t2); });
        else cb&&cb(v,st,t);
      });
      return;
    }
    cb&&cb(v,st,t);
  });
}
function whyFail(status,txt){
  txt=String(txt||"");
  if(status===401||status===403||/permission|denied/i.test(txt))
    return L("Firebase qoidalarida \"arena\" bo'limiga ruxsat yo'q.","The Firebase rules do not allow the \"arena\" section.");
  if(!status) return L("Internet uzildi yoki bazaga ulanib bo'lmadi.","The connection dropped or the database is unreachable.");
  return L("Baza xatosi","Database error")+" ("+status+")";
}
var DB={
  get:function(p,cb){ req("GET",p,undefined,cb); },
  set:function(p,v,cb){ req("PUT",p,(v===undefined?null:v),cb); },
  upd:function(p,v,cb){ req("PATCH",p,v,cb); },
  del:function(p,cb){ req("DELETE",p,undefined,cb); }
};
var WATCH=[];
function watch(path,ms,cb){
  var h={stop:false};

    if(h.stop) return;
    DB.get(path,function(v){ if(h.stop) return; cb(v); h.t=setTimeout(tick,ms); });
  })();
  WATCH.push(h); return h;
}

function seedOf(code,round){ var h=7; var s=code+"|"+round; for(var i=0;i<s.length;i++) h=(h*131+s.charCodeAt(i))>>>0; return h; }
function rng(seed){ var x=seed||1; return function(){ x^=x<<13;x>>>=0; x^=x>>17; x^=x<<5;x>>>=0; return x/4294967296; }; }
function shuffle(a,rand){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(rand()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

var MAXP=20;
function placePts(rank,n){
  if(n<=1) return 100;
  if(n<=4) return [100,75,50,25][rank-1];
  return Math.max(10,Math.round(100-(rank-1)*(90/(n-1))));
}
function rankPoints(list,higher){
  /* list: [{id,raw}] -> {id:pts}  teng natijalar o'rtacha ball oladi */
  var v=list.slice().filter(function(x){ return typeof x.raw==="number" && isFinite(x.raw); });
  v.sort(function(a,b){ return higher? b.raw-a.raw : a.raw-b.raw; });
  var out={}, i=0;
  while(i<v.length){
    var j=i; while(j+1<v.length && v[j+1].raw===v[i].raw) j++;
    var sum=0, n=j-i+1;
    for(var k=i;k<=j;k++) sum+=placePts(k+1,v.length);
    var avg=Math.round(sum/n);
    for(var k2=i;k2<=j;k2++) out[v[k2].id]=avg;
    i=j+1;
  }
  list.forEach(function(x){ if(out[x.id]===undefined) out[x.id]=0; });
  return out;
}

var FX=(function(){
  var AC=null, muted=false;
  try{ muted=localStorage.getItem("terdu_mute")==="1"; }catch(e){}
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(f,d,type,vol){
    if(muted) return; var a=ac(); if(!a) return;
    try{
      var o=a.createOscillator(), g=a.createGain();
      o.type=type||"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(vol||.06,a.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(d||.12));
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||.12)+.02);
    }catch(e){}
  }
  function vib(ms){ try{ if(navigator.vibrate&&!muted) navigator.vibrate(ms); }catch(e){} }
  var S={
    tap:function(){ beep(520,.05,"triangle",.04); },
    ok:function(){ beep(660,.09,"sine",.07); setTimeout(function(){beep(880,.12,"sine",.06)},70); vib(20); },
    no:function(){ beep(190,.18,"sawtooth",.05); vib([25,40,25]); },
    tick:function(){ beep(1100,.03,"square",.02); },
    go:function(){ beep(440,.1); setTimeout(function(){beep(660,.16)},130); },
    win:function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,.22,"triangle",.07); },i*120); }); vib([40,60,40,60,90]); },
    lose:function(){ [440,330,247].forEach(function(f,i){ setTimeout(function(){ beep(f,.2,"sine",.05); },i*130); }); },
    pop:function(){ beep(880,.06,"square",.035); },
    merge:function(){ beep(392,.08,"triangle",.05); }
  };
  function mute(v){ muted=v; try{localStorage.setItem("terdu_mute",v?"1":"0")}catch(e){} }
  function isMuted(){ return muted; }
  /* --- suzuvchi ball --- */
  function pop(x,y,txt,col){
    var d=document.createElement("div"); d.className="pop"; d.textContent=txt;
    if(col) d.style.color=col;
    d.style.left=(x-18)+"px"; d.style.top=(y-20)+"px";
    document.body.appendChild(d); setTimeout(function(){ d.remove(); },1000);
  }
  function popAt(node,txt,col){
    if(!node) return; var r=node.getBoundingClientRect();
    pop(r.left+r.width/2, r.top+r.height/2, txt, col);
  }
  /* --- konfetti --- */
  function confetti(ms){
    var cv=document.getElementById("fx"); if(!cv) return;
    cv.width=innerWidth; cv.height=innerHeight; cv.style.display="block";
    var x=cv.getContext("2d"), cols=["#12a150","#2563eb","#7c3aed","#f59e0b","#ec4899","#0891b2"], P=[];
    for(var i=0;i<130;i++) P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
      w:5+Math.random()*7,h:8+Math.random()*10,c:cols[i%cols.length],
      vy:2+Math.random()*3.4,vx:-1.4+Math.random()*2.8,r:Math.random()*6,vr:-.2+Math.random()*.4});
    var t0=Date.now();
    (function loop(){
      x.clearRect(0,0,cv.width,cv.height);
      P.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
        x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
        x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
      if(Date.now()-t0<(ms||3200)) requestAnimationFrame(loop);
      else { x.clearRect(0,0,cv.width,cv.height); cv.style.display="none"; }
    })();
  }
  function shake(n){ if(!n) return; n.classList.add("shake"); setTimeout(function(){ n.classList.remove("shake"); },400); }
  return {s:S,pop:pop,popAt:popAt,confetti:confetti,shake:shake,mute:mute,isMuted:isMuted,vib:vib};
})();

function pairSetup(c){
  var ids=c.players.map(function(p){return p.id});
  var off=(c.round-1)%Math.max(1,ids.length);
  var order=ids.slice(off).concat(ids.slice(0,off));
  var pi=order.indexOf(c.me.id), pair=Math.floor(pi/2), mine=pi%2;
  var opp=order[pair*2+(1-mine)];
  return {pair:pair,mine:mine,opp:opp,
    oppName:(c.players.filter(function(p){return p.id===opp})[0]||{}).name||"?"};
}

}

      var vr=meWhite?r:(7-r), vc=meWhite?c2:(7-c2);
      var cell=el('<button style="aspect-ratio:1;border:none;cursor:pointer;display:grid;place-items:center;padding:0;font-size:clamp(20px,6vw,30px)"></button>');
      cell.style.gridRow=(vr+1); cell.style.gridColumn=(vc+1);
      cell.style.background=((r+c2)%2===0)?"#f0d9b5":"#a06a3f";
      if(sel===i) cell.style.background="#f6c343";
      if(tgt.some(function(m){ return m.t===i; })) cell.style.boxShadow="inset 0 0 0 4px #12a150";
      if(ch!=="."){
        cell.textContent=GL[ch.toLowerCase()];
        cell.style.color=isW(ch)?"#ffffff":"#111827";
        cell.style.textShadow=isW(ch)?"0 1px 2px rgba(0,0,0,.6)":"0 1px 2px rgba(255,255,255,.35)";
      }
      (function(i,ch){
        cell.onclick=function(){
          if(fin||st.t!==P.mine) return;
          var lg2=legal(st.b,P.mine,st.cs,st.ep);
          if(sel!==null){
            var mv=lg2.filter(function(m){ return m.f===sel&&m.t===i; })[0];
            if(mv){ play(mv); return; }
          }
          if(ch!=="."&&side(ch)===P.mine&&lg2.some(function(m){return m.f===i})){ sel=i; c.fx.s.tap(); paint(); }
          else { sel=null; paint(); }
        };
      })(i,ch);
      bd.appendChild(cell);
    }
    var inChk=attacked(st.b,kingSq(st.b,st.t),1-st.t);
    var txt=my?L("Sizning yurishingiz","Your move"):L("Raqib o'ylamoqda…","Opponent is thinking…");
    if(inChk) txt=(my?"⚠️ "+L("Sizga shoh!","Check!"):"⚔️ "+L("Raqibga shoh","Check on the opponent"));
    c.el.querySelector("#cst").textContent=txt;
    c.el.querySelector("#csi").textContent=L("Kuch","Material")+": "+material(st.b,P.mine)+" : "+material(st.b,1-P.mine);
  }
  function play(mv){
    var r=doMove(st.b,mv,P.mine,st.cs,st.ep);
    st.b=r.b; st.cs=r.cs; st.ep=r.ep; st.t=1-P.mine; sel=null;
    c.fx.s[mv.fl==="P"?"win":"tap"]();
    lastFen=st.b+"|"+st.t;
    DB.set(path,{b:st.b,t:st.t,cs:st.cs,ep:st.ep});
    paint(); check();
  }
  function check(){
    if(fin) return;
    var lg=legal(st.b,st.t,st.cs,st.ep);
    if(lg.length) return;
    var inChk=attacked(st.b,kingSq(st.b,st.t),1-st.t);
    fin=true;
    if(!inChk){ c.fx.s.pop(); c.prog(100,160); c.finish(160); return; }   /* pat */
    if(st.t===P.mine){ c.fx.s.lose(); c.prog(100,70); c.finish(70); }
    else { c.fx.s.win(); c.fx.confetti(2400); c.prog(100,320); c.finish(320); }
  }
  if(P.mine===0) DB.get(path,function(v){ if(!v) DB.set(path,{b:st.b,t:0,cs:st.cs,ep:-1}); });
  paint(); c.prog(10,0);
  watch(path,900,function(v){
    if(!v||fin) return;
    var key=v.b+"|"+v.t; if(key===lastFen) return;
    lastFen=key; st.b=v.b; st.t=v.t; st.cs=v.cs||"-"; st.ep=(v.ep===undefined?-1:v.ep);
    sel=null; paint(); check();
  });
  return {end:function(){ if(!fin){ fin=true;
    var d=material(st.b,P.mine)-material(st.b,1-P.mine);
    c.finish(d>1?240:(d<-1?90:150)); } }};
 }});

        '<p class="note">'+L("Baza nomi","Database name")+': <b>'+esc(CFG.db)+'</b></p></div>');

      var b=list[i++];

      .then(function(r){ return r.text().then(function(tx){ return {s:r.status,t:tx}; }); })

                  (r.s===404?L("bunday baza yo'q","no such database"):("HTTP "+r.s));
          out.push("<div>"+line(b,why+" ("+r.s+")",false)+"</div>");
        }
        show(); next();
      })
      .catch(function(){ if(fin2) return; fin2=true; clearTimeout(t);
        out.push("<div>"+line(b,L("ulanib bo'lmadi","cannot connect"),false)+"</div>"); show(); next(); });
    })();
  }

function cleanup(){
  DB.get("meta/cleanAt",function(v){

    DB.del("hist");   /* eski natijalar ham saqlanmaydi */
    DB.get("rooms",function(rs){
      if(!rs) return;
      Object.keys(rs).forEach(function(k){
        var m=rs[k]&&rs[k].meta; if(!m) return;
        var eski=!m.at||now-m.at>6*3600000;
        var tugagan=m.doneAt&&now-m.doneAt>600000;
        if(eski||tugagan){ DB.del("rooms/"+k); DB.del("public/"+k); }
      });
    });
  });
}

/* ---------- xona ---------- */
function vRoom(code,tryN){
  RC=code;
  tryN=tryN||0;
  var cached = JUST_CREATED[code];
  if(cached && Date.now()-cached.at < 20000 && cached.data && cached.data.meta){
    ROOM = cached.data; ROOM.code = code;
    if(!ROOM.players) ROOM.players = {};
    if(!ROOM.players[ME.id]){
      ROOM.players[ME.id] = {id:ME.id,name:ME.name,surname:ME.surname||"",group:ME.group||"",ready:1,seen:Date.now()};
    }
    startRoom(code);
    setTimeout(function(){ DB.get("rooms/"+code,function(v){ if(v&&v.meta){ ROOM=v; ROOM.code=code; } }); }, 1500);
    return;
  }
  ROOM=null;
  APP.innerHTML=card('<p class="note center">'+L("Xona yuklanmoqda…","Loading the room…")+(tryN?" ("+(tryN+1)+"/5)":"")+'</p>');
  DB.get("rooms/"+code,function(v,status,txt){
    if((!v||!v.meta)&&tryN<4){ setTimeout(function(){ if(location.hash.indexOf(code)>0) vRoom(code,tryN+1); },900); return; }
    cached = JUST_CREATED[code];
    if((!v||!v.meta) && cached && Date.now()-cached.at < 30000 && cached.data && cached.data.meta){
      v = cached.data;
    }
    if(!v||!v.meta){ APP.innerHTML=card('<div class="center"><div style="font-size:40px">🚪</div><h2>'+L("Bunday xona yo'q","No such room")+
      '</h2><p class="note">'+L("Kod noto'g'ri yoki musobaqa tugagan.","The code is wrong or the competition has ended.")+'</p>'+
      (LASTERR?'<p class="note">⚠️ '+esc(LASTERR)+'</p>':'')+
      '<div class="row" style="justify-content:center;margin-top:12px">'+
      '<button class="btn accent" id="rb">← '+L("Orqaga","Back")+'</button>'+
      '<button class="btn" id="rd">🔎 '+L("Ulanish tekshiruvi","Connection test")+'</button></div>'+
      '<div id="diag" style="margin-top:12px"></div></div>');
      document.getElementById("rd").onclick=function(){ nav("#/"); setTimeout(function(){ var b=document.getElementById("bDiag"); if(b) b.click(); },400); };
      document.getElementById("rb").onclick=function(){ nav("#/"); }; return; }
    var pl=v.players||{}, n=Object.keys(pl).length;

      if(v.state&&v.state.ph!=="lobby"){ toast(L("Musobaqa boshlangan","The competition has started")); }
      var cap=v.meta.max||4;
      if(n>=cap){ APP.innerHTML=card('<div class="center"><h2>'+L("Xona to'lgan","The room is full")+'</h2><p class="note">'+
        L("Bu musobaqadagi barcha joylar band.","All the seats are taken.")+'</p><button class="btn" id="rb2" style="margin-top:12px">← '+L("Orqaga","Back")+'</button></div>');
        document.getElementById("rb2").onclick=function(){ nav("#/"); }; return; }
      DB.set("rooms/"+code+"/players/"+ME.id,{id:ME.id,name:ME.name,surname:ME.surname||"",group:ME.group||"",ready:0,seen:Date.now()},function(){
        if(v.meta.pub) DB.upd("public/"+code,{n:n+1});
        startRoom(code);
      });
      return;
    }
    startRoom(code);
  });
}
function startRoom(code){
  clearInterval(HB);
  HB=setInterval(function(){ DB.set("rooms/"+code+"/players/"+ME.id+"/seen",Date.now()); },5000);
  DB.set("rooms/"+code+"/players/"+ME.id+"/seen",Date.now());
  var lastPh="", lastR=-1, lastCnt=-1, miss=0;
  if(ROOM && ROOM.code===code && ROOM.meta){
    try{ render(ROOM); }catch(e){}
  }
  watch("rooms/"+code,1400,function(v){
    if(!v||!v.meta){
      miss++;
      var jc = JUST_CREATED[code];
      if(jc && Date.now()-jc.at < 25000){
        if(jc.data && jc.data.meta){ v = jc.data; }
        else return;
      } else if(miss < 4){
        return;
      } else {
        toast(L("Xona yopildi","The room was closed")); nav("#/"); return;
      }
    } else {
      miss = 0;
      if(JUST_CREATED[code]) delete JUST_CREATED[code];
    }
    ROOM=v; v.code=code;
    var st=v.state||{ph:"lobby",r:0}, pls=plList(v), key=st.ph+"|"+st.r;
    if(isHost(v)) hostTick(v);
    if(key!==lastPh+"|"+lastR || (st.ph==="lobby"&&pls.length+readyN(v)!==lastCnt)){
      lastPh=st.ph; lastR=st.r; lastCnt=pls.length+readyN(v);
      render(v);
    }
  });
}
function plList(v){
  var p=v.players||{};
  return Object.keys(p).map(function(k){return p[k]}).sort(function(a,b){ return (a.id<b.id)?-1:1; });
}
function readyN(v){ return plList(v).filter(function(p){return p.ready}).length; }
function isHost(v){
  if(v.meta.host===ME.id) return true;
  var h=(v.players||{})[v.meta.host];
  if(h&&Date.now()-(h.seen||0)<25000) return false;
  var alive=plList(v).filter(function(p){ return Date.now()-(p.seen||0)<25000; });
  return alive.length&&alive[0].id===ME.id;
}
function render(v){
  var st=v.state||{ph:"lobby"};
  if(st.ph==="lobby") return vLobby(v);
  if(st.ph==="play") return vPlay(v);
  if(st.ph==="res") return vRes(v);
  if(st.ph==="end") return vEnd(v);
}
function vLobby(v){

    card('<h3>👥 '+L("Ishtirokchilar","Players")+' ('+pls.length+'/'+cap+')</h3><div class="plist" style="margin-top:10px">'+slots+'</div>'+
      '<div class="row" style="margin-top:14px">'+
      '<button class="btn '+(mine.ready?"":"accent")+'" id="lr">'+(mine.ready?"↩ "+L("Tayyor emasman","Not ready"):"✅ "+L("Tayyorman","I am ready"))+'</button>'+
      '<button class="btn" id="lc">🔗 '+L("Havolani nusxalash","Copy invite link")+'</button>'+

    card('<h3>🎯 '+L("Tanlangan o'yinlar","Selected games")+' ('+v.meta.games.length+')</h3>'+
      '<div class="grid g4" style="margin-top:10px">'+v.meta.games.map(function(g){return gameCard(g,true)}).join("")+'</div>'+

   (isHost(v)?'<div class="card" style="margin-top:16px"><div class="row"><div style="flex:1"><b>'+L("Boshlash","Start")+'</b><p class="note" style="margin:4px 0 0">'+
      (solo?L("Yolg'iz mashq rejimi.","Solo practice mode."):L("Kamida 2 ta ishtirokchi kerak.","At least two players are needed."))+'</p></div>'+
      '<button class="btn accent" id="lgo"'+((pls.length<2&&!solo)?" disabled":"")+'>🚀 '+L("Musobaqani boshlash","Start the competition")+'</button></div></div>'
    :'<p class="note center" style="margin-top:16px">'+L("Host boshlashini kuting…","Waiting for the host to start…")+'</p>');
  document.getElementById("lr").onclick=function(){ DB.set("rooms/"+v.code+"/players/"+ME.id+"/ready",mine.ready?0:1,function(){ DB.get("rooms/"+v.code,function(x){ if(x){x.code=v.code; ROOM=x; vLobby(x);} }); }); };
  document.getElementById("lc").onclick=function(){

  if(go) go.onclick=function(){

    if(v.meta.games.length<1){ toast(L("Kamida bitta o'yin kerak","At least one game")); return; }

function gameDur(v,gid){ return v.meta.limit>0?v.meta.limit:(GAMES[gid].dur||60); }
function startRound(v,r){
  var gid=v.meta.games[r-1];
  if(!gid){ finishAll(v); return; }
  var start=Date.now()+4200, dur=gameDur(v,gid);
  DB.set("rooms/"+v.code+"/state",{ph:"play",g:gid,r:r,startAt:start,endAt:start+dur*1000,seed:seedOf(v.code,r)});
  DB.set("rooms/"+v.code+"/meta/status","playing");
}
function hostTick(v){
  var st=v.state||{};
  if(st.ph==="play"){
    var pls=plList(v).filter(function(p){ return Date.now()-(p.seen||0)<30000; });
    var sc=(v.scores||{}), done=pls.filter(function(p){ return sc[p.id]&&sc[p.id]["r"+st.r]!==undefined; }).length;
    if((done>=pls.length&&pls.length>0)||Date.now()>st.endAt+2500) scoreRound(v);
  } else if(st.ph==="res"){
    if(Date.now()>(st.nextAt||0)){
      if(st.r>=v.meta.games.length) finishAll(v); else startRound(v,st.r+1);
    }
  }
}
function scoreRound(v){
  var st=v.state, g=GAMES[st.g], pls=plList(v), sc=v.scores||{};
  var list=pls.map(function(p){ var e=(sc[p.id]||{})["r"+st.r]; return {id:p.id,raw:e&&typeof e.raw==="number"?e.raw:(g.higher?-1:999999)}; });
  var pts=rankPoints(list,g.higher);
  var tot=v.tot||{};
  pls.forEach(function(p){ tot[p.id]=(tot[p.id]||0)+(pts[p.id]||0); });
  DB.set("rooms/"+v.code+"/pts/r"+st.r,pts);
  DB.set("rooms/"+v.code+"/tot",tot);
  DB.upd("rooms/"+v.code+"/state",{ph:"res",nextAt:Date.now()+7000});
}
function finishAll(v){
  var tot=v.tot||{}, pls=plList(v);
  var rank=pls.map(function(p){ return {id:p.id,name:p.name+" "+(p.surname||""),pts:tot[p.id]||0}; })
    .sort(function(a,b){ return b.pts-a.pts; });
  DB.upd("rooms/"+v.code+"/state",{ph:"end"});
  DB.set("rooms/"+v.code+"/meta/status","done");
  DB.set("rooms/"+v.code+"/meta/doneAt",Date.now());
  DB.del("public/"+v.code);
  /* Natija saqlanmaydi: o'yin tugagach ballar ahamiyatini yo'qotadi.
     Xona o'yinchilar natijani ko'rib ulgurishi uchun 3 daqiqadan keyin o'chiriladi. */
  setTimeout(function(){ DB.del("rooms/"+v.code); },180000);
}
function vPlay(v){
  var st=v.state, g=GAMES[st.g], pls=plList(v);
  var bg=GBG[st.g]||["#2563eb33","#7c3aed33"];
  APP.innerHTML='<div class="hud"><b>'+g.ic+" "+esc(L(g.nm[0],g.nm[1]))+'</b>'+

    '<div class="opps" id="opps" style="flex:1"></div>'+

    '<circle class="fgc" id="rg" cx="26" cy="26" r="22" stroke-dasharray="138" stroke-dashoffset="0"></circle></svg>'+
    '<span class="t" id="tmr">--</span></div>'+
    '<div class="stage gb" id="stage" style="--c1:'+bg[0]+';--c2:'+bg[1]+'"></div>';
  var stage=document.getElementById("stage"), timer=document.getElementById("tmr"), ring=document.getElementById("rg");

  stage.innerHTML='<div class="center"><div style="font-size:52px">'+g.ic+'</div><h2>'+esc(L(g.nm[0],g.nm[1]))+

  var cd=el('<div class="cd"><b id="cdn">3</b></div>'); document.body.appendChild(cd);
  /* jonli raqiblar paneli */
  var pv={}, myP=0, myS=0, lastPush=0;
  function pushProg(p,sc){
    myP=p; myS=sc;
    if(Date.now()-lastPush<1800) return;
    lastPush=Date.now();
    DB.set("rooms/"+v.code+"/prog/"+ME.id,{p:Math.round(p),s:Math.round(sc||0),at:Date.now()});
  }
  watch("rooms/"+v.code+"/prog",1600,function(pr){
    var box=document.getElementById("opps"); if(!box) return;
    box.innerHTML=pls.map(function(p){
      var d=(pr||{})[p.id]||{}, done=d.p>=100;
      return '<span class="opp'+(done?" done":"")+'" title="'+esc(p.name)+'">'+
        '<span class="av" style="background:'+colorOf(p.id)+'">'+esc(initials(p.name,p.surname))+'</span>'+
        (done?"✅":'<span class="pb"><i style="width:'+Math.min(100,d.p||0)+'%"></i></span>')+'</span>';
    }).join("");
  });
  var lastBeep=0;
  clearInterval(TICK);
  TICK=setInterval(function(){
    var now=Date.now();
    if(now<st.startAt){
      var sec=Math.ceil((st.startAt-now)/1000);
      var n=document.getElementById("cdn");
      if(n&&n.textContent!==(sec>0?String(sec):"GO!")){ n.textContent=sec>0?sec:"GO!"; if(sec>0) FX.s.tick(); else FX.s.go(); }
      timer.textContent=esec(total); return;
    }
    if(cd.parentNode) cd.remove();
    if(!started){
      started=true;
      var ctx={el:stage,seed:st.seed,rand:rng(st.seed),endAt:st.endAt,me:ME,players:pls,code:v.code,round:st.r,
        fx:FX,L:L,prog:pushProg,teams:(v.meta.teams===1),startAt:st.startAt,
        finish:function(raw){ if(sent) return; sent=true; pushProg(100,raw); lastPush=0; pushProg(100,raw); submit(v,st,raw); }};
      try{ inst=g.run(ctx); }
      catch(e){ stage.innerHTML='<p class="note center">'+L("O'yinni yuklashda xato","Error loading the game")+'</p>'; submit(v,st,0); }
      RUN=inst;
    }
    var left=st.endAt-now;

    timer.classList.toggle("low",left<10000);
    if(ring) ring.setAttribute("stroke-dashoffset",String(138*(1-Math.max(0,left)/total)));

    if(left<=0){

      if(inst&&inst.end) inst.end();

        '</h2><p class="note">'+L("Natijalar hisoblanmoqda…","Calculating the results…")+'</p></div>';
    }
  },200);

function submit(v,st,raw){

function saToken(make,cb){

  function keep(a){ SA=a; try{ localStorage.setItem("terdu_sa",JSON.stringify(a)); }catch(e){} fin(a.tok); }
  function fresh(){
    tmo(fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+KAPI,{method:"POST",
        headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'}),9000)

        headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(SA.ref)}),9000)

        keep({uid:j.user_id,tok:j.id_token,ref:j.refresh_token,exp:Date.now()+(+j.expires_in||3600)*1000}); })

function clockSync(cb){

/* DIQQAT: khScore engine_js.txt dagi nusxa bilan AYNAN bir xil bo'lishi kerak */
function khScore(g,upto){
  var m=(g&&g.meta)||{}, n=+m.nq||0, qs=(+m.qsec||15)*1000, P=(g&&g.p)||{}, Q=(g&&g.q)||{}, K=(g&&g.k)||{}, A=(g&&g.a)||{};
  if(upto==null||upto>n) upto=n;
  var rows=Object.keys(P).map(function(sid){
    var pp=P[sid]||{}, r={sid:sid,n:pp.n||"?",g:pp.g||"",at:+pp.at||0,s:0,c:0,tm:0,st:0,last:null};
    for(var i=0;i<upto;i++){
      var a=(A[i]||{})[sid], k=K[i], q=Q[i];
      if(a&&k&&q&&+a.c===+k.c){
        var dt=Math.max(0,Math.min(qs,(+a.t||0)-(+q.at||0)));
        var base=Math.round(1000*(1-dt/qs/2));
        r.st++; var bon=Math.min(500,(r.st-1)*100);
        r.s+=base+bon; r.c++; r.tm+=dt;
        if(i===upto-1) r.last={ok:true,pts:base+bon,dt:dt,st:r.st};
      } else {
        r.st=0;
        if(i===upto-1) r.last={ok:false,pts:0,ans:!!a};
      }
    }
    return r;
  });
  rows.sort(function(x,y){ return y.s-x.s || y.c-x.c || x.tm-y.tm || x.at-y.at || (x.sid<y.sid?-1:1); });
  rows.forEach(function(r,i){ r.rank=i+1; });
  var cnt=rows.length, valid=cnt>=(+m.min||7), pr={};
  if(valid&&upto===n&&n>0){
    var big=m.pr&&+m.pr.big||20, pz=(m.pr&&(cnt>big?m.pr.b:m.pr.a))||(cnt>big?[5,4,3,2,1]:[5,4,3]);
    for(var j=0;j<pz.length&&j<rows.length;j++) if(rows[j].s>0) pr[rows[j].sid]=+pz[j];
  }
  return {rows:rows,n:cnt,valid:valid,prizes:pr};
}

function lvFind(){

  var after=snow()>=LV.meta.start+1200;

function lvLoad(kind,i){
  var key=kind+i;
  if(LV.busy[key]&&Date.now()-LV.busy[key]<450) return;
  LV.busy[key]=Date.now();
  kget("games/"+LV.d+"/"+kind+"/"+i,function(v,st){
    if(!LV||st!==200) return;                    /* hali vaqti kelmagan — keyingi tikda qayta so'raladi */
    if(kind==="a") LV.a[i]=v||{};
    else if(v) LV[kind][i]=v; else return;
    var ph=LV.phase;
    if(kind==="q"&&ph==="q"+i) lvRender();
    if(ph.charAt(0)==="r"&&!LV.shown[ph]&&lvReady(+ph.slice(1))) lvRender();
  });
}

function lvTick(){

  var t=snow(), m=LV.meta;
  if(t>=m.open&&(t<m.start||!LV.pFinal)) lvPollP();
  var ph=lvPhase(t), c=ph.charAt(0), i=+ph.slice(1);
  if(c==="q"&&!LV.q[i]) lvLoad("q",i);

      '<div class="center" style="margin-top:16px"><a class="lv-btn" href="#/" style="display:inline-block;text-decoration:none">🏠 '+L("Arenaga qaytish","Back to the arena")+'</a></div>';
    lvSetMyScore(khScore(LV.full));
    if(!LV.shown.end){ LV.shown.end=1; KS.fanfare(); FX.confetti(me&&pz[me.sid]?5200:2600); }
    return;
  }
}

/* ---------- bosh sahifadagi "Jonli test" kartasi ---------- */
function homeLive(){
  var box=document.getElementById("lcard"); if(!box) return;
  clearInterval(HOMET);
  var q='?orderBy='+encodeURIComponent('"$key"')+'&startAt='+encodeURIComponent('"'+kday(Date.now())+'"')+'&limitToFirst=3';
  Promise.all([
    tmo(fetch(BASE+"/kahoot/idx.json"+q),9000).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }),
    tmo(fetch(BASE+"/kahoot/cfg.json"),9000).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
  ]).then(function(v){
    var idx=v[0]||{}, cfg=v[1]||{};
    function draw(){
      var b=document.getElementById("lcard"); if(!b){ clearInterval(HOMET); return; }
      var now=Date.now(), ks=Object.keys(idx).sort(), g=null;
      if(cfg.on!==false) for(var i=0;i<ks.length;i++){ if(+idx[ks[i]].end>now){ g={d:ks[i],e:idx[ks[i]]}; break; } }
      var s1,s2,btn;
      if(!g){ s1=L("Hali rejalashtirilmagan","Not scheduled yet"); s2=L("Shartlar bilan tanishing","Read the rules"); btn=L("Batafsil","Details"); b.className="live-card"; }
      else if(now<g.e.open){ s1=kWhen(g.d,g.e.start); s2=L("Boshlanishiga ","Starts in ")+kLeft(g.e.start-now); btn=L("Shartlar","Rules"); b.className="live-card"; }
      else if(now<g.e.start){ s1="🔴 "+L("Lobbi ochiq — hozir qo'shiling!","The lobby is open — join now!"); s2=L("Boshlanishiga ","Starts in ")+kLeft(g.e.start-now); btn=L("Qo'shilish","Join"); b.className="live-card hot"; }
      else { s1="🎮 "+L("O'yin hozir ketmoqda","The game is on now"); s2=L("Natijalarni ko'ring","See the results"); btn=L("Ochish","Open"); b.className="live-card on"; }
      var h='<div class="lc-shapes"><i class="s0"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>'+
        '<div class="lc-txt"><span class="lc-k">⚡ '+L("JONLI TEST","LIVE QUIZ")+'</span><b>'+esc(s1)+'</b><span>'+esc(s2)+'</span>'+
        '<small>'+L("Kuniga 1 marta · 15 soniyalik savollar · g'oliblarga reyting balli","Once a day · 15-second questions · rating points for the winners")+'</small></div>'+
        '<span class="lc-btn">'+esc(btn)+' ›</span>';
      if(b._h!==h){ b.innerHTML=h; b._h=h; }
    }
    draw(); HOMET=setInterval(draw,1000);
  });
}

/* ---------- router ---------- */
function route(){
  unwatchAll(); clearInterval(TICK); clearInterval(HB); clearInterval(HOMET); lvStop();
  if(RUN&&RUN.off){ try{RUN.off()}catch(e){} RUN=null; }
  var cd=document.querySelector(".cd"); if(cd) cd.remove();
  var h=location.hash||"#/";
  if(!ME) return need();
  if(ME.status&&ME.status!=="ok") return pending();
  if(!online) return offline();
  if(h==="#/live") return vLive();              /* jonli test arena yopiq bo'lsa ham ishlaydi */
  if(!ARENA_OPEN) return closed();
  if(h.indexOf("#/room/")===0) return vRoom(h.slice(7).toUpperCase().slice(0,4));
  if(h==="#/create") return vCreate();
  if(h==="#/join") return vJoin();
  return vHome();
}
window.addEventListener("hashchange",route);
chrome();
document.getElementById("btnSnd").textContent=FX.isMuted()?"🔇":"🔊";
loadMe();
APP.innerHTML=card('<p class="note center">'+L("Serverga ulanmoqda…","Connecting…")+'</p>');
connect(function(ok,why){ online=ok; route(); if(!ok&&why==="rules") offline(); });
})();
