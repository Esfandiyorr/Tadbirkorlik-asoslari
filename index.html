<script>
/* til (UZ / ENG) va tun/kun rejimi — taqdimotlar bilan bir xil saqlanadi (terdu_lang, terdu_theme) */
(function(){
  var html=document.documentElement;
  function lang(){ return html.getAttribute("lang")==="en"?"en":"uz"; }
  function paint(){
    var l=lang();
    [].forEach.call(document.querySelectorAll("[data-uz]"),function(e){ e.textContent=e.getAttribute("data-"+l)||e.getAttribute("data-uz"); });
    document.getElementById("langTxt").textContent=l==="en"?"UZB":"ENG";
    var d=html.getAttribute("data-theme")==="dark";
    document.getElementById("themeTxt").textContent=l==="en"?(d?"Light":"Dark"):(d?"Kun":"Tun");
    document.title=l==="en"?"Fundamentals of Entrepreneurship — TerDU":"Tadbirkorlik asoslari — TerDU";
  }
  function setLang(){ var n=lang()==="en"?"uz":"en"; html.setAttribute("lang",n); try{ localStorage.setItem("terdu_lang",n); }catch(e){} paint(); }
  function setTheme(){ var n=html.getAttribute("data-theme")==="dark"?"light":"dark"; html.setAttribute("data-theme",n); try{ localStorage.setItem("terdu_theme",n); }catch(e){} paint(); }
  document.getElementById("btnLang").onclick=setLang;
  document.getElementById("btnTheme").onclick=setTheme;
  document.addEventListener("keydown",function(e){
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==="l"||e.key==="L") setLang(); else if(e.key==="d"||e.key==="D") setTheme();
  });
  paint();
})();
</script>
